name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

# Publishing lives in this workflow (see the `publish` job), so this group is
# also what serializes it. Two pushes landing on `main` a minute apart used to
# start two independent publish runs with nothing ordering them: whichever
# finished last won `:latest`, and a slow build of the older commit overwriting
# a fast build of the newer one left production running code that had already
# been superseded (#651). Keyed on the ref, one run at a time, newest wins —
# `cancel-in-progress` stops the older run rather than letting it finish and
# repoint the tag. Pull requests key on their number instead, so a force-push
# cancels its own previous run and nobody else's.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # The tag the `image` job builds into the runner's own daemon. Never pushed —
  # it exists so the smoke and the scan below have something to name.
  SMOKE_IMAGE: clawdia:ci

jobs:
  test:
    runs-on: ubuntu-latest
    # Without this a hung step runs until GitHub's 6-hour default. One did: an
    # apt mirror stopped responding and the job sat for 49 minutes before anyone
    # looked, with the tests never started. The suite itself takes ~10s.
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # canvas 3.x ships prebuilt binaries covering this runner, so the install
      # normally needs no toolchain. These headers are kept as a fallback: if a
      # future Node ABI or platform has no prebuild, node-gyp compiles from
      # source and needs them, and a missing header here is a confusing failure.
      #
      # Because it is a fallback, it must never be able to decide the run.
      # `continue-on-error` is the point of this step's configuration, not the
      # timeouts: a bounded step that still fails the job would turn every apt
      # outage into a red PR, when the packages are usually not needed at all.
      # If a build genuinely needs them, `npm ci` fails on the next step with a
      # node-gyp error naming the missing header, which is the clearer signal.
      #
      # The apt options bound each mirror connection rather than letting it hang
      # forever, which is the failure that prompted all of this.
      - name: Install native build dependencies for canvas (fallback path)
        continue-on-error: true
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
          APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y \
            libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install dependencies
        run: npm ci

      # `--ci` so a missing snapshot fails here instead of being written into
      # the runner's filesystem and thrown away; `--coverage` because that is
      # what applies the coverageThreshold ratchet in jest.config.js. Without
      # it the thresholds exist but nothing ever checks them, which is the
      # state this replaced (#635).
      #
      # `npm test` no longer passes `--forceExit` (#630), which is what makes a
      # leaked handle — an undisconnected Mongoose client, a cron nobody
      # `.unref()`d — visible instead of silently shot at the end of the run.
      # The trade is that such a leak now hangs rather than exits, so this step
      # is bounded on its own. Under the job's 20 so the hang fails *here*, with
      # enough of the budget left for the three `always()` steps below to still
      # report; without it they would be killed alongside it and the run would
      # say nothing about coverage or lint at all. The suite takes about a
      # minute, or a few on a cold cache while mongodb-memory-server fetches its
      # binary for the integration suites, so ten is slack rather than a target.
      - name: Run tests
        timeout-minutes: 10
        run: npm test -- --ci --coverage

      # The global ratchet is one number over the whole of src, so it cannot
      # see *where* the coverage is: src/services/ai is at 80% and
      # src/commands/economy at 20%, and deleting every AI test would cost
      # about four points of a 37% total and stay green. This applies a floor
      # per directory, and fails on a file that stops being executed at all
      # (#625). `always()` so it still runs when the global threshold failed —
      # the two answers together say what actually moved.
      - name: Check per-subsystem coverage floors
        if: always()
        run: npm run coverage:check

      # The four numbers, on the run's summary page rather than buried in the
      # log. `always()` because the interesting case is the run where the
      # ratchet just failed and you want to see by how much.
      - name: Report coverage
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            {
              echo '### Coverage'
              echo
              echo '| Metric | Covered | Total | % |'
              echo '|---|---:|---:|---:|'
              node -e '
                const t = require("./coverage/coverage-summary.json").total;
                for (const m of ["statements", "branches", "functions", "lines"]) {
                  console.log(`| ${m} | ${t[m].covered} | ${t[m].total} | ${t[m].pct}% |`);
                }
              '
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # A step in this job rather than a job of its own: it needs the same
      # `npm ci`, and a second job would pay for that install again to save a
      # few seconds. After the tests, with `always()`, so the two signals are
      # independent — an unused variable never hides which tests failed, and a
      # failing test never hides the lint result either. Both still fail the
      # job, which is what the publish job's `needs:` is gating on.
      - name: Lint
        if: always()
        run: npm run lint

      # #645: CI gated on the tests and nothing else, so a dependency with a
      # published advisory reached the image with nothing in the way. Dependabot
      # raises the bump, but a bump nobody merges is not a control; this is what
      # notices it is still sitting there.
      #
      # `high` is the level, not `moderate`: this is a Discord bot whose
      # dependency tree is large enough that a moderate-level gate would spend
      # most of its life red on advisories that do not apply, and a gate that is
      # normally red is a gate everyone learns to merge past. The whole tree is
      # audited, dev dependencies included — a compromised build-time package
      # runs against the checkout with a registry credential nearby, which is
      # not obviously the smaller problem.
      #
      # `always()` for the same reason as lint: a failing suite must not hide
      # the advisory, and an advisory must not hide which tests failed.
      - name: Audit dependencies
        if: always()
        run: npm audit --audit-level=high

  # #646: the Dockerfile was built in exactly one place — the publish job below,
  # which runs on `main` after a merge. So a Dockerfile regression was found by
  # the deploy rather than by the pull request that caused it, and the first
  # symptom was a failed publish on a branch that was already merged. This image
  # compiles `canvas` from source against Alpine's cairo/pango headers in one
  # stage and links it against a separately-installed set of runtime libraries
  # in the next, which is exactly the shape of thing a base-image bump breaks
  # without touching a line of JavaScript.
  #
  # Built on every event, pull requests included, and never pushed. Alongside
  # `test` rather than after it: the two answer different questions, and a red
  # suite should not hide a broken image any more than the reverse. The publish
  # job needs both, so nothing reaches the registry that has not been built,
  # booted and scanned here first — and because this job writes the same
  # `type=gha` cache, that publish is a cache hit rather than a second compile.
  image:
    name: Build, boot and scan Docker image
    runs-on: ubuntu-latest
    # On a cold cache this compiles canvas from source, which is minutes rather
    # than seconds; a warm one is a small fraction of that. Matches the publish
    # job's budget, since it is the same build.
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # The whole point of this job. A pull request has no credentials worth
          # using and no tag anything deploys.
          push: false
          # ...but the steps below need to `docker run` it, and a buildx build
          # otherwise leaves its result in the builder cache and nowhere else.
          load: true
          tags: ${{ env.SMOKE_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Everything that is true of the image rather than of the source tree: the
      # native canvas binding actually links, the fonts the card generators
      # register are installed at the path Alpine puts them, the process is not
      # root. See scripts/image-smoke.js for why each one is in there.
      - name: Smoke-test the image
        timeout-minutes: 5
        run: |
          docker run --rm --entrypoint node "$SMOKE_IMAGE" scripts/image-smoke.js

      # The other half: that the image boots. Run with its real entrypoint and
      # no configuration at all, `src/index.js` loads its entire require graph —
      # discord.js, mongoose, every command module below it — and is then turned
      # away by config/validateEnv.js, which is its first statement after the
      # secrets are read. Reaching that message means every layer resolved;
      # anything else (a missing module, a broken tini, a bad ENTRYPOINT) fails
      # before it and says so.
      #
      # Deliberately not booted further than this: past the validator it would
      # want a Discord token and a MongoDB, and a smoke test that needs the
      # production credentials is a smoke test nobody can run on a fork.
      - name: Boot the image far enough to reject its own config
        timeout-minutes: 5
        run: |
          set +e
          output=$(docker run --rm "$SMOKE_IMAGE" 2>&1)
          status=$?
          set -e

          echo "$output"

          if [ "$status" -ne 1 ]; then
            echo "::error::expected the entrypoint to exit 1 on an empty config, got $status"
            exit 1
          fi

          if ! printf '%s' "$output" | grep -q 'Missing required environment variables'; then
            echo "::error::the image did not reach config/validateEnv.js — something below it failed to load"
            exit 1
          fi

          echo "image boots and rejects an empty config, as expected"

      # #645: nothing scanned the published image, so a CVE in the base layer or
      # in an installed apk was only ever found by someone scanning production.
      #
      # Two deliberate narrowings, because a scan that is always red is a scan
      # nobody reads. `ignore-unfixed` drops findings with no fixed version
      # available — there is no action to take on those beyond changing base
      # image, and they are the bulk of an Alpine report. HIGH and CRITICAL only,
      # matching the `--audit-level=high` the npm side uses, so the two halves of
      # the dependency surface are gated at the same bar.
      #
      # The scan runs before anything is pushed, so a finding stops the image
      # existing rather than being raised against one already deployed.
      - name: Scan the image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.SMOKE_IMAGE }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  # Publishing lives here, behind `needs: [test, image]`, rather than in its own
  # workflow. It used to be a separate file triggered on `push: main`, which
  # ran alongside the tests instead of after them: a commit that broke the
  # suite still got built and pushed as `:latest`, and `:latest` is the tag
  # portainer-stack.yml deploys. Red tests now stop the image existing at all.
  #
  # `workflow_run` would also have worked, but it runs against the default
  # branch and re-resolves the commit, which is a sharper edge than a job that
  # simply depends on the one before it in the same run.
  publish:
    name: Build and publish Docker image
    needs: [test, image]
    # Pull requests build the image in the `image` job above but publish
    # nothing: they have no push credentials worth using and no tag that
    # anything deploys. Pushes to main and to v* tags do.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    # Every action below is pinned to a commit SHA, not a floating tag. This is
    # the job holding `packages: write` and pushing the `:latest` that
    # portainer-stack.yml deploys, so a tag repointed upstream — by a
    # compromised maintainer account or a stolen token — would run attacker code
    # with a registry credential in the environment. A SHA cannot be repointed.
    # Dependabot's `github-actions` ecosystem raises the version bumps.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # `main` and `latest` both move: they name whatever built last, so
            # neither can name the build that was running before this one.
            # sha-<full commit> is published for every build and is the rollback
            # target portainer-stack.yml's CLAWDIA_IMAGE_TAG takes (#637).
            #
            # It is stable, not immutable: re-running this workflow on the same
            # commit rebuilds and repoints it, and the rebuild can differ because
            # dependency resolution is not pinned to the lockfile alone. The
            # digest published alongside it is the reference that cannot move —
            # see the summary step after the build, and docs/RELEASING.md for
            # pinning to one.
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attestations, attached to the image in the registry (#652).
          # `sbom` is an SPDX inventory of what the image contains, which is
          # what turns "does any published build ship the vulnerable version?"
          # into a registry query instead of a re-scan of every tag. `provenance`
          # is a SLSA statement of what built it — this repo, this commit, this
          # workflow — which is what lets a deploy verify the image came out of
          # CI rather than from someone's laptop with push access.
          #
          # mode=max records the full build definition, including build
          # arguments. Nothing secret goes through build args here (the
          # Dockerfile takes none), which is the condition for max being safe;
          # if one is ever added, drop this back to mode=min before it lands.
          provenance: mode=max
          sbom: true

      # The digest, on the run's summary page. Every tag above can be repointed
      # by a later build — including sha-<commit>, by a re-run of this very
      # workflow — so the digest is the only reference that always names *this*
      # build. Recording it here is what makes it available at rollback time,
      # when the run that produced it is weeks old and nobody wants to go
      # spelunking in the registry API for it.
      - name: Record image digest
        run: |
          {
            echo '### Image'
            echo
            echo '| | |'
            echo '|---|---|'
            echo "| digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| rollback to this build | \`CLAWDIA_IMAGE_TAG=latest@${{ steps.build.outputs.digest }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
