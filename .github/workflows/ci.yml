name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    # Without this a hung step runs until GitHub's 6-hour default. One did: an
    # apt mirror stopped responding and the job sat for 49 minutes before anyone
    # looked, with the tests never started. The suite itself takes ~10s.
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # canvas 3.x ships prebuilt binaries covering this runner, so the install
      # normally needs no toolchain. These headers are kept as a fallback: if a
      # future Node ABI or platform has no prebuild, node-gyp compiles from
      # source and needs them, and a missing header here is a confusing failure.
      #
      # Because it is a fallback, it must never be able to decide the run.
      # `continue-on-error` is the point of this step's configuration, not the
      # timeouts: a bounded step that still fails the job would turn every apt
      # outage into a red PR, when the packages are usually not needed at all.
      # If a build genuinely needs them, `npm ci` fails on the next step with a
      # node-gyp error naming the missing header, which is the clearer signal.
      #
      # The apt options bound each mirror connection rather than letting it hang
      # forever, which is the failure that prompted all of this.
      - name: Install native build dependencies for canvas (fallback path)
        continue-on-error: true
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
          APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y \
            libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install dependencies
        run: npm ci

      # `--ci` so a missing snapshot fails here instead of being written into
      # the runner's filesystem and thrown away; `--coverage` because that is
      # what applies the coverageThreshold ratchet in jest.config.js. Without
      # it the thresholds exist but nothing ever checks them, which is the
      # state this replaced (#635).
      - name: Run tests
        run: npm test -- --ci --coverage

      # The global ratchet is one number over the whole of src, so it cannot
      # see *where* the coverage is: src/services/ai is at 80% and
      # src/commands/economy at 20%, and deleting every AI test would cost
      # about four points of a 37% total and stay green. This applies a floor
      # per directory, and fails on a file that stops being executed at all
      # (#625). `always()` so it still runs when the global threshold failed —
      # the two answers together say what actually moved.
      - name: Check per-subsystem coverage floors
        if: always()
        run: npm run coverage:check

      # The four numbers, on the run's summary page rather than buried in the
      # log. `always()` because the interesting case is the run where the
      # ratchet just failed and you want to see by how much.
      - name: Report coverage
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            {
              echo '### Coverage'
              echo
              echo '| Metric | Covered | Total | % |'
              echo '|---|---:|---:|---:|'
              node -e '
                const t = require("./coverage/coverage-summary.json").total;
                for (const m of ["statements", "branches", "functions", "lines"]) {
                  console.log(`| ${m} | ${t[m].covered} | ${t[m].total} | ${t[m].pct}% |`);
                }
              '
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # A step in this job rather than a job of its own: it needs the same
      # `npm ci`, and a second job would pay for that install again to save a
      # few seconds. After the tests, with `always()`, so the two signals are
      # independent — an unused variable never hides which tests failed, and a
      # failing test never hides the lint result either. Both still fail the
      # job, which is what `publish: needs: test` is gating on.
      - name: Lint
        if: always()
        run: npm run lint

  # Publishing lives here, behind `needs: test`, rather than in its own
  # workflow. It used to be a separate file triggered on `push: main`, which
  # ran alongside the tests instead of after them: a commit that broke the
  # suite still got built and pushed as `:latest`, and `:latest` is the tag
  # portainer-stack.yml deploys. Red tests now stop the image existing at all.
  #
  # `workflow_run` would also have worked, but it runs against the default
  # branch and re-resolves the commit, which is a sharper edge than a job that
  # simply depends on the one before it in the same run.
  publish:
    name: Build and publish Docker image
    needs: test
    # Pull requests build nothing: they have no push credentials worth using
    # and no tag that anything deploys. Pushes to main and to v* tags do.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    # Every action below is pinned to a commit SHA, not a floating tag. This is
    # the job holding `packages: write` and pushing the `:latest` that
    # portainer-stack.yml deploys, so a tag repointed upstream — by a
    # compromised maintainer account or a stolen token — would run attacker code
    # with a registry credential in the environment. A SHA cannot be repointed.
    # Dependabot's `github-actions` ecosystem raises the version bumps.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # `main` and `latest` both move: they name whatever built last, so
            # neither can name the build that was running before this one.
            # sha-<full commit> is published for every build and is the rollback
            # target portainer-stack.yml's CLAWDIA_IMAGE_TAG takes (#637).
            #
            # It is stable, not immutable: re-running this workflow on the same
            # commit rebuilds and repoints it, and the rebuild can differ because
            # dependency resolution is not pinned to the lockfile alone. The
            # digest published alongside it is the reference that cannot move —
            # see the summary step after the build, and docs/RELEASING.md for
            # pinning to one.
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The digest, on the run's summary page. Every tag above can be repointed
      # by a later build — including sha-<commit>, by a re-run of this very
      # workflow — so the digest is the only reference that always names *this*
      # build. Recording it here is what makes it available at rollback time,
      # when the run that produced it is weeks old and nobody wants to go
      # spelunking in the registry API for it.
      - name: Record image digest
        run: |
          {
            echo '### Image'
            echo
            echo '| | |'
            echo '|---|---|'
            echo "| digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| rollback to this build | \`CLAWDIA_IMAGE_TAG=latest@${{ steps.build.outputs.digest }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
