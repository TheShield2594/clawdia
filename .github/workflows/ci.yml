name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

# Publishing lives in this workflow (see the `publish` job), so this group is
# also what serializes it. Two pushes landing on `main` a minute apart used to
# start two independent publish runs with nothing ordering them: whichever
# finished last won `:latest`, and a slow build of the older commit overwriting
# a fast build of the newer one left production running code that had already
# been superseded (#651). Keyed on the ref, one run at a time, newest wins —
# `cancel-in-progress` stops the older run rather than letting it finish and
# repoint the tag. Pull requests key on their number instead, so a force-push
# cancels its own previous run and nobody else's.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # The tag the `image` job builds into the runner's own daemon. Never pushed —
  # it exists so the smoke and the scan below have something to name.
  SMOKE_IMAGE: clawdia:ci

jobs:
  test:
    runs-on: ubuntu-latest
    # Without this a hung step runs until GitHub's 6-hour default. One did: an
    # apt mirror stopped responding and the job sat for 49 minutes before anyone
    # looked, with the tests never started. The suite itself takes ~10s.
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # canvas 3.x ships prebuilt binaries covering this runner, so the install
      # normally needs no toolchain. These headers are kept as a fallback: if a
      # future Node ABI or platform has no prebuild, node-gyp compiles from
      # source and needs them, and a missing header here is a confusing failure.
      #
      # Because it is a fallback, it must never be able to decide the run.
      # `continue-on-error` is the point of this step's configuration, not the
      # timeouts: a bounded step that still fails the job would turn every apt
      # outage into a red PR, when the packages are usually not needed at all.
      # If a build genuinely needs them, `npm ci` fails on the next step with a
      # node-gyp error naming the missing header, which is the clearer signal.
      #
      # The apt options bound each mirror connection rather than letting it hang
      # forever, which is the failure that prompted all of this.
      - name: Install native build dependencies for canvas (fallback path)
        continue-on-error: true
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
          APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y \
            libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install dependencies
        run: npm ci

      # `--ci` so a missing snapshot fails here instead of being written into
      # the runner's filesystem and thrown away; `--coverage` because that is
      # what applies the coverageThreshold ratchet in jest.config.js. Without
      # it the thresholds exist but nothing ever checks them, which is the
      # state this replaced (#635).
      #
      # `npm test` no longer passes `--forceExit` (#630), which is what makes a
      # leaked handle — an undisconnected Mongoose client, a cron nobody
      # `.unref()`d — visible instead of silently shot at the end of the run.
      # The trade is that such a leak now hangs rather than exits, so this step
      # is bounded on its own. Under the job's 20 so the hang fails *here*, with
      # enough of the budget left for the three `always()` steps below to still
      # report; without it they would be killed alongside it and the run would
      # say nothing about coverage or lint at all. The suite takes about a
      # minute, or a few on a cold cache while mongodb-memory-server fetches its
      # binary for the integration suites, so ten is slack rather than a target.
      - name: Run tests
        timeout-minutes: 10
        run: npm test -- --ci --coverage

      # The global ratchet is one number over the whole of src, so it cannot
      # see *where* the coverage is: src/services/ai is at 80% and
      # src/commands/economy at 20%, and deleting every AI test would cost
      # about four points of a 37% total and stay green. This applies a floor
      # per directory, and fails on a file that stops being executed at all
      # (#625). `always()` so it still runs when the global threshold failed —
      # the two answers together say what actually moved.
      - name: Check per-subsystem coverage floors
        if: always()
        run: npm run coverage:check

      # The four numbers, on the run's summary page rather than buried in the
      # log. `always()` because the interesting case is the run where the
      # ratchet just failed and you want to see by how much.
      - name: Report coverage
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            {
              echo '### Coverage'
              echo
              echo '| Metric | Covered | Total | % |'
              echo '|---|---:|---:|---:|'
              node -e '
                const t = require("./coverage/coverage-summary.json").total;
                for (const m of ["statements", "branches", "functions", "lines"]) {
                  console.log(`| ${m} | ${t[m].covered} | ${t[m].total} | ${t[m].pct}% |`);
                }
              '
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # A step in this job rather than a job of its own: it needs the same
      # `npm ci`, and a second job would pay for that install again to save a
      # few seconds. After the tests, with `always()`, so the two signals are
      # independent — an unused variable never hides which tests failed, and a
      # failing test never hides the lint result either. Both still fail the
      # job, which is what the publish job's `needs:` is gating on.
      - name: Lint
        if: always()
        run: npm run lint

      # #940: CI lints and tests the JavaScript thoroughly and checked nothing
      # about the files that deploy it. The four steps below are the ops half,
      # and they are steps in this job rather than a job of their own for the
      # reason the lint step above already is: one of them needs `npm ci` for
      # js-yaml, and a second job would pay for that install again to save a few
      # seconds. `always()` throughout, so a red suite never hides them and they
      # never hide each other.
      #
      # This was not a hypothetical gap. The first run of the third step found
      # that both stack files' backup entrypoints had been truncated two thirds
      # of the way through by an apostrophe in a comment — compose splits a
      # string entrypoint into arguments, and a single quote inside the script
      # ends it — so the backup container had been starting, failing to parse
      # its own script, and exiting. See scripts/lint-stack-shell.js.
      - name: Lint the Dockerfile
        if: always()
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          # The rule this turns off, and why, are recorded in the file itself.
          config: .hadolint.yaml
          # Repeated from that file because it has to be. The action passes this
          # input through the environment and the environment beats the config,
          # so leaving it at the action's `info` default would silently discard
          # the threshold .hadolint.yaml states — which is how the first run of
          # this step failed, on an info-level finding the file had already
          # decided not to gate on.
          failure-threshold: warning

      # ubuntu-latest ships shellcheck, so this needs no install and no action.
      # `-x` follows `. lib/archive.sh`, which restore.sh and verify-backup.sh
      # both source — without it the shared functions are unchecked and every
      # variable they set reads as unassigned in the scripts that use them.
      - name: Lint the shell scripts
        if: always()
        run: |
          shellcheck --version
          shellcheck -x --severity=warning scripts/*.sh scripts/lib/*.sh

      - name: Lint the shell inside the stack files
        if: always()
        run: npm run lint:stacks

      # Neither stack file is parsed by anything else in CI, so a typo in one
      # was found by the deploy that failed on it. `--quiet` because the point
      # is the exit code: interpolation resolves, the schema is honoured, every
      # anchor and merge key lands. .env.example stands in for the .env an
      # operator writes — services declare `env_file: .env`, and a compose
      # version that treats a missing one as fatal would otherwise fail here for
      # a reason that has nothing to do with the file being checked.
      - name: Validate both stack files
        if: always()
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config --quiet
          docker compose -f portainer-stack.yml config --quiet
          rm -f .env

      # #645: CI gated on the tests and nothing else, so a dependency with a
      # published advisory reached the image with nothing in the way. Dependabot
      # raises the bump, but a bump nobody merges is not a control; this is what
      # notices it is still sitting there.
      #
      # `high` is the level, not `moderate`: this is a Discord bot whose
      # dependency tree is large enough that a moderate-level gate would spend
      # most of its life red on advisories that do not apply, and a gate that is
      # normally red is a gate everyone learns to merge past. The whole tree is
      # audited, dev dependencies included — a compromised build-time package
      # runs against the checkout with a registry credential nearby, which is
      # not obviously the smaller problem.
      #
      # `always()` for the same reason as lint: a failing suite must not hide
      # the advisory, and an advisory must not hide which tests failed.
      #
      # `npm audit` exits non-zero for two unrelated reasons: it found
      # advisories at or above the level, or it never managed to ask. Read
      # alike, an npmjs blip arrives as a security finding — which is how a
      # green pull request came to be blocked by a 503 from the registry's bulk
      # advisory endpoint, with nothing in the log to say the tree had simply
      # not been audited. security-scan.yml was fixed for exactly this on its
      # weekly job; this is the same guard on the gate that people actually
      # merge past, where a false alarm is worse because it is the one that
      # teaches everyone to merge past it.
      #
      # The two steps are deliberately the same script. They already have to
      # stay at the same bar — see the note in security-scan.yml — and
      # tests/ciSupplyChainGates.test.js and tests/scheduledSecurityScan.test.js
      # run each of them for real against a stubbed npm, so a copy that drifts
      # is a copy that fails.
      - name: Audit dependencies
        if: always()
        run: |
          attempt=1
          attempts=3

          while true; do
            output=$(npm audit --audit-level=high 2>&1) && status=0 || status=$?
            printf '%s\n' "$output"

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            # Matched on npm's own words for "I could not reach the registry",
            # not on the HTTP code: "503" and "Service Unavailable" both turn
            # up inside advisory titles and version ranges, and reading a real
            # finding as an outage would retry it and then report the wrong
            # reason for the failure.
            if ! printf '%s\n' "$output" | grep -qiE 'audit endpoint returned an error|npm (error|ERR!) network|npm (error|ERR!) code (ENOTFOUND|ECONNRESET|ETIMEDOUT|EAI_AGAIN|ECONNREFUSED|ENETUNREACH)'; then
              exit "$status"
            fi

            if [ "$attempt" -ge "$attempts" ]; then
              echo "::error::npm audit could not reach the registry in $attempts attempts — the dependency tree has not been audited this run"
              exit 1
            fi

            echo "::notice::npm audit could not reach the registry (attempt $attempt of $attempts); retrying"
            sleep $(( attempt * 15 ))
            attempt=$(( attempt + 1 ))
          done

  # #646: the Dockerfile was built in exactly one place — the publish job below,
  # which runs on `main` after a merge. So a Dockerfile regression was found by
  # the deploy rather than by the pull request that caused it, and the first
  # symptom was a failed publish on a branch that was already merged. This image
  # compiles `canvas` from source against Alpine's cairo/pango headers in one
  # stage and links it against a separately-installed set of runtime libraries
  # in the next, which is exactly the shape of thing a base-image bump breaks
  # without touching a line of JavaScript.
  #
  # Built on every event, pull requests included, and never pushed. Alongside
  # `test` rather than after it: the two answer different questions, and a red
  # suite should not hide a broken image any more than the reverse.
  #
  # What `publish: needs: […, image, …]` buys is worth stating precisely, because
  # `needs:` orders the jobs and nothing more — it does not hand this image
  # over, and that job builds again before it pushes. So the guarantee is that
  # the same commit, Dockerfile, lockfile and digest-pinned base produced an
  # image that booted and scanned clean; it is not byte identity, because
  # `apk add` resolves whatever Alpine is serving at the moment of each build.
  # The `type=gha` cache this job writes is what closes that in practice: the
  # publish build is a cache hit rather than a second compile, and a cache hit is
  # the same layers. The residue is a cache miss inside a single run.
  #
  # All of that is about amd64. Since #941 the publish job also builds arm64,
  # and the `arm64` job below is what holds that half to the same vulnerability
  # gate before the manifest list goes out. It is a job of its own rather than
  # more steps here for two reasons: buildx cannot `--load` a multi-platform
  # result, so the scan needs a single-platform build to name, and that build is
  # emulated — minutes of it, on a tree that compiles `canvas` from source —
  # which is not a cost worth paying on a pull request that publishes nothing.
  #
  # So the two differ, and docs/SETUP_GUIDE.md says how: amd64 is booted and
  # scanned on every event, arm64 is compiled and scanned on the events that
  # publish. Booting arm64 as well would mean running an emulated Node through
  # its whole require graph, and is not done.
  #
  # Closing it properly means pushing a staging tag from here and promoting it by
  # digest, which needs `packages: write` in a job that also runs on pull
  # requests. That is a wider exposure than the gap it closes — the separation is
  # why publish is a job of its own — so it is deliberately not done here.
  image:
    name: Build, boot and scan Docker image
    runs-on: ubuntu-latest
    # On a cold cache this compiles canvas from source, which is minutes rather
    # than seconds; a warm one is a small fraction of that. Native throughout —
    # the emulated build that needs a bigger budget is the `arm64` job below.
    timeout-minutes: 30
    outputs:
      # Read by `publish` so both builds carry the same value — see the step
      # that computes it, and the note on the publish build.
      apk-refresh: ${{ steps.apk.outputs.key }}
      # The amd64 layers this job actually booted and scanned, for `publish` to
      # check what it pushed against (#952).
      scanned-layers: ${{ steps.layers.outputs.diff-ids }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The cache key for the Dockerfile's `apk upgrade` layer (#961). Without
      # one, `cache-from: type=gha` restores that layer instead of running it,
      # and the upgrade the runtime stage exists to perform is frozen at
      # whatever Alpine was serving when the layer was first built — a package
      # with a published fix stays vulnerable in the image, and the scan below
      # is what eventually says so.
      #
      # A UTC date rather than the commit SHA or `github.run_id`: those change
      # every build, which would mean a cold apk layer on every push for a
      # freshness nobody needs. A day is well inside the window that matters and
      # keeps the cache doing its job the rest of the time.
      - name: Compute the apk refresh key
        id: apk
        run: echo "key=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          build-args: |
            APK_REFRESH=${{ steps.apk.outputs.key }}
          # The whole point of this job. A pull request has no credentials worth
          # using and no tag anything deploys.
          push: false
          # ...but the steps below need to `docker run` it, and a buildx build
          # otherwise leaves its result in the builder cache and nowhere else.
          load: true
          tags: ${{ env.SMOKE_IMAGE }}
          # Scoped per platform. Both this job and `arm64` below export a cache
          # on every push, and a buildx export replaces the whole manifest for
          # the scope it writes — unscoped, the second to finish would evict the
          # first and `publish` would rebuild whichever it lost. The names are
          # what `publish` reads back.
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      # Everything that is true of the image rather than of the source tree: the
      # native canvas binding actually links, the fonts the card generators
      # register are installed at the path Alpine puts them, the process is not
      # root. See scripts/image-smoke.js for why each one is in there.
      - name: Smoke-test the image
        timeout-minutes: 5
        run: |
          docker run --rm --entrypoint node "$SMOKE_IMAGE" scripts/image-smoke.js

      # The other half: that the image boots. Run with its real entrypoint and
      # no configuration at all, `src/index.js` loads its entire require graph —
      # discord.js, mongoose, every command module below it — and is then turned
      # away by config/validateEnv.js, which is its first statement after the
      # secrets are read. Reaching that message means every layer resolved;
      # anything else (a missing module, a broken tini, a bad ENTRYPOINT) fails
      # before it and says so.
      #
      # Deliberately not booted further than this: past the validator it would
      # want a Discord token and a MongoDB, and a smoke test that needs the
      # production credentials is a smoke test nobody can run on a fork.
      - name: Boot the image far enough to reject its own config
        timeout-minutes: 5
        run: |
          set +e
          output=$(docker run --rm "$SMOKE_IMAGE" 2>&1)
          status=$?
          set -e

          echo "$output"

          if [ "$status" -ne 1 ]; then
            echo "::error::expected the entrypoint to exit 1 on an empty config, got $status"
            exit 1
          fi

          if ! printf '%s' "$output" | grep -q 'Missing required environment variables'; then
            echo "::error::the image did not reach config/validateEnv.js — something below it failed to load"
            exit 1
          fi

          echo "image boots and rejects an empty config, as expected"

      # #645: nothing scanned the published image, so a CVE in the base layer or
      # in an installed apk was only ever found by someone scanning production.
      #
      # Two deliberate narrowings, because a scan that is always red is a scan
      # nobody reads. `ignore-unfixed` drops findings with no fixed version
      # available — there is no action to take on those beyond changing base
      # image, and they are the bulk of an Alpine report. HIGH and CRITICAL only,
      # matching the `--audit-level=high` the npm side uses, so the two halves of
      # the dependency surface are gated at the same bar.
      #
      # The scan runs before anything is pushed, so a finding stops the image
      # existing rather than being raised against one already deployed.
      - name: Scan the image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.SMOKE_IMAGE }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      # What "the tested image" actually is, written down so the publish job can
      # be held to it (#952).
      #
      # `publish` rebuilds rather than promoting this artifact, and the note at
      # the top of this job explains why that is not fixed by pushing a staging
      # tag from here: it would need `packages: write` in a job that also runs
      # on pull requests, which is a wider exposure than the gap it closes. What
      # was missing is not the guarantee — it is that a *breach* of the
      # guarantee was silent. A cache eviction between the two jobs would have
      # published an image nothing in this job ever looked at, and nothing
      # anywhere would have said so.
      #
      # Diff IDs rather than the image digest, because the digest cannot answer
      # the question. `publish` adds OCI labels from docker/metadata-action, and
      # a label lands in the image config — so the config digest, and with it
      # the manifest digest, differ between the two builds every single time
      # even on a perfect cache hit. Diff IDs are the uncompressed content
      # hashes of the filesystem layers, which is precisely "the same bytes" and
      # is untouched by labels.
      #
      # This step runs after the scan, so what it records is only ever an image
      # that passed. A failing scan stops the job here and there is nothing to
      # compare against.
      - name: Record the layers that were booted and scanned
        id: layers
        run: |
          diff_ids=$(docker image inspect --format '{{json .RootFS.Layers}}' "$SMOKE_IMAGE")
          echo "amd64 layers that passed the smoke test and the scan:"
          printf '%s\n' "$diff_ids"
          echo "diff-ids=$diff_ids" >> "$GITHUB_OUTPUT"

  # The arm64 half of what `publish` pushes, built and scanned before it goes
  # out. Added because the multi-platform publish of #941 put an image into the
  # manifest list that the Trivy gate had never looked at — the gate's whole
  # premise, stated on the scan step above, is that a finding stops the image
  # existing rather than being raised against one already deployed, and that
  # premise did not survive the second platform.
  #
  # Only where it can matter. Nothing publishes on a pull request, and this is
  # an emulated build of the stage that compiles `canvas` from source, so the
  # condition below is what keeps that cost off every PR. `needs: image` is for
  # the apk refresh key: the same value has to reach all three builds, or they
  # are three different images and this scans one nobody ships.
  #
  # What this buys is what the amd64 pair buys, with the same residue: the same
  # commit, Dockerfile, lockfile and digest-pinned base produced an arm64 image
  # that scanned clean, and the cache is what makes the build `publish` pushes
  # the same layers rather than merely the same inputs.
  arm64:
    name: Build and scan the arm64 image
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      # The arm64 half of the same check the amd64 job records (#952).
      scanned-layers: ${{ steps.layers.outputs.diff-ids }}
    # Emulated, and cold on the first build after a Dockerfile or lockfile
    # change: tens of minutes rather than the handful the native build takes.
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same pin, and for a weaker version of the same reason as in `publish`:
      # this job holds no registry credential, but a mutable image run
      # `--privileged` against the checkout is not something to leave floating
      # anywhere. Both steps move together.
      - name: Set up QEMU for the arm64 build
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v9.2.2@sha256:1b804311fe87047a4c96d38b4b3ef6f62fca8cd125265917a9e3dc3c996c39e6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the arm64 image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/arm64
          build-args: |
            APK_REFRESH=${{ needs.image.outputs.apk-refresh }}
          # Never pushed from here: this job has no credentials and the manifest
          # list is `publish`'s to assemble. `load` is what gives the scan below
          # something to name.
          push: false
          load: true
          tags: ${{ env.SMOKE_IMAGE }}-arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

      # Same narrowings as the amd64 scan above, and deliberately the same: the
      # two platforms are gated at one bar or the bar means nothing.
      #
      # Trivy reads the image's layers rather than running it, so an arm64
      # filesystem is as scannable on this runner as a native one. The findings
      # are usually the same as amd64's — both stages install the same Alpine
      # packages from the same repository — and "usually" is the reason this
      # exists.
      - name: Scan the arm64 image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.SMOKE_IMAGE }}-arm64
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      # The arm64 half of the record the amd64 job keeps — same reasoning, same
      # reason it is diff IDs and not a digest. See that step (#952).
      #
      # Both platforms or neither: `publish` assembles one manifest list out of
      # two caches, and either restore can miss independently. Checking only
      # amd64 would report half of the thing that can go wrong.
      - name: Record the arm64 layers that were scanned
        id: layers
        run: |
          diff_ids=$(docker image inspect --format '{{json .RootFS.Layers}}' "${SMOKE_IMAGE}-arm64")
          echo "arm64 layers that passed the scan:"
          printf '%s\n' "$diff_ids"
          echo "diff-ids=$diff_ids" >> "$GITHUB_OUTPUT"

  # Publishing lives here, behind `needs: [test, image, arm64]`, rather than in its own
  # workflow. It used to be a separate file triggered on `push: main`, which
  # ran alongside the tests instead of after them: a commit that broke the
  # suite still got built and pushed as `:latest`, and `:latest` is the tag
  # portainer-stack.yml deploys. Red tests now stop the image existing at all.
  #
  # `workflow_run` would also have worked, but it runs against the default
  # branch and re-resolves the commit, which is a sharper edge than a job that
  # simply depends on the one before it in the same run.
  publish:
    name: Build and publish Docker image
    needs: [test, image, arm64]
    # Pull requests build the image in the `image` job above but publish
    # nothing: they have no push credentials worth using and no tag that
    # anything deploys. Pushes to main and to v* tags do.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Three times the `image` job's budget, for the arm64 half added in #941.
    # In the ordinary case this job builds nothing: `image` and `arm64` have
    # each just built and checked their platform, and this assembles the
    # manifest list out of their caches. The budget is for the case where one of
    # those restores misses and buildx compiles `canvas` under emulation again.
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    # Lifted to the job so the step below can be conditional on it (#953). A
    # step `if:` cannot read the `secrets` context, but it can read `env`, and
    # this is the documented way to spell "only if the operator configured one".
    # Unset — which is the default, and every fork — it is the empty string and
    # the step is skipped.
    env:
      PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}

    # Every action below is pinned to a commit SHA, not a floating tag. This is
    # the job holding `packages: write` and pushing the `:latest` that
    # portainer-stack.yml deploys, so a tag repointed upstream — by a
    # compromised maintainer account or a stolen token — would run attacker code
    # with a registry credential in the environment. A SHA cannot be repointed.
    # Dependabot's `github-actions` ecosystem raises the version bumps.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # `main` and `latest` both move: they name whatever built last, so
            # neither can name the build that was running before this one.
            # sha-<full commit> is published for every build and is the rollback
            # target portainer-stack.yml's CLAWDIA_IMAGE_TAG takes (#637).
            #
            # It is stable, not immutable: re-running this workflow on the same
            # commit rebuilds and repoints it, and the rebuild can differ because
            # dependency resolution is not pinned to the lockfile alone. The
            # digest published alongside it is the reference that cannot move —
            # see the summary step after the build, and docs/RELEASING.md for
            # pinning to one.
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Registers the binfmt handlers that let the arm64 half of the build below
      # run its RUN steps on this amd64 runner (#941). Only the publish job
      # needs it: the `image` job builds one native platform and loads it.
      #
      # `image` is pinned for the same reason every `uses:` in this job is. The
      # action's default is `tonistiigi/binfmt:latest`, a mutable tag it then
      # runs `--privileged` — in the one job holding `packages: write`, after
      # the GHCR login above. A repointed tag there is arbitrary privileged code
      # beside a registry credential, which is precisely the exposure the SHA
      # pinning below was written against. Tag kept beside the digest, as in the
      # Dockerfile: the digest is what resolves, the tag is the readable half.
      - name: Set up QEMU for the arm64 build
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v9.2.2@sha256:1b804311fe87047a4c96d38b4b3ef6f62fca8cd125265917a9e3dc3c996c39e6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # Taken from the `image` job rather than recomputed, for the same
          # reason that job's cache is reused here: a different value is a
          # different build, so this would publish an image the scan never
          # looked at — and it would miss the cache and rebuild to do it. Two
          # `date` calls in one run normally agree; the one run that straddles
          # midnight UTC is exactly the case worth not leaving to chance.
          build-args: |
            APK_REFRESH=${{ needs.image.outputs.apk-refresh }}
          # #941: the image was amd64 only, which rules out a Raspberry Pi, an
          # Oracle Ampere instance and an Apple Silicon machine — three of the
          # commonest places somebody self-hosts a Discord bot, and an odd set
          # to exclude from a project whose whole pitch is that you host it
          # yourself. Both platforms go out under one tag as a manifest list, so
          # `docker pull` on either resolves without anybody choosing.
          #
          # It is not free: arm64 is emulated on an amd64 runner and this tree
          # compiles `canvas` from source, which is what the raised timeout
          # above is for. The dependency is worth naming here, because it is the
          # whole of the cost — docs/CANVAS_BACKEND.md records the measured case
          # for @napi-rs/canvas, which ships prebuilt musl binaries for both
          # architectures and would turn this compile into a download twice
          # over.
          #
          # Neither platform reaches the registry unscanned: `image` boots and
          # scans amd64, `arm64` scans arm64, and both gate this job through
          # `needs:`.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Both platform scopes, and no export of its own. `image` and `arm64`
          # are the producers — each has just built and checked the platform it
          # writes — so this build is meant to be two cache hits and an assembly
          # of the manifest list. Exporting from here would write a third
          # manifest over one of theirs for no gain.
          #
          # A miss is slow rather than wrong: buildx rebuilds the platform it
          # could not restore, which for arm64 is the emulated compile the
          # timeout above is sized for. It is also what makes "the image that
          # scanned clean" and "the image that was pushed" the same layers
          # rather than merely the same inputs.
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
          # Attestations, attached to the image in the registry (#652).
          # `sbom` is an SPDX inventory of what the image contains, which is
          # what turns "does any published build ship the vulnerable version?"
          # into a registry query instead of a re-scan of every tag. `provenance`
          # is a SLSA statement of what built it — this repo, this commit, this
          # workflow — which is what lets a deploy verify the image came out of
          # CI rather than from someone's laptop with push access.
          #
          # mode=max records the full build definition, including build
          # arguments. The condition for max being safe is that no build
          # argument carries a secret. The Dockerfile takes exactly one,
          # APK_REFRESH, and it is a UTC date — recording it is a small gain,
          # since the provenance then says which day's Alpine packages the
          # image resolved against. Adding a build argument that carries
          # anything sensitive means dropping this back to mode=min first.
          provenance: mode=max
          sbom: true

      # What was published, on the run's summary page.
      #
      # The digest is here because every tag above can be repointed by a later
      # build — including sha-<commit>, by a re-run of this very workflow — so
      # it is the only reference that always names *this* build. Recording it is
      # what makes it available at rollback time, when the run that produced it
      # is weeks old and nobody wants to go spelunking in the registry API.
      #
      # The sha- tag is here for the other direction (#953). Nothing tells a
      # deployment that a newer image exists: the Portainer stack needs a manual
      # redeploy to pick up a repointed `:latest`, and a deployment pinned to a
      # specific CLAWDIA_IMAGE_TAG gets no signal at all — so a security fix can
      # sit published and undeployed indefinitely because nothing announced it.
      # The webhook below is the active half of that answer and is opt-in; this
      # is the half that always runs, and it is written as the line to paste
      # rather than as a bare tag so that an operator reading CI has the deploy
      # in front of them rather than a fact to act on.
      - name: Record what was published
        run: |
          {
            echo '### Image'
            echo
            echo '| | |'
            echo '|---|---|'
            echo "| digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| deploy this build | \`CLAWDIA_IMAGE_TAG=sha-${{ github.sha }}\` |"
            echo "| pin it immutably | \`CLAWDIA_IMAGE_TAG=latest@${{ steps.build.outputs.digest }}\` |"
            echo
            echo 'Set that in the stack environment and redeploy. See docs/RELEASING.md.'
          } >> "$GITHUB_STEP_SUMMARY"

      # Whether the bytes that were just pushed are the bytes the gates looked
      # at (#952).
      #
      # This job rebuilds rather than promoting the artifact `image` and `arm64`
      # checked, and the note at the top of the `image` job says why promoting
      # by digest is not done: it needs `packages: write` in a job that also
      # runs on pull requests, which is a wider exposure than the gap it closes.
      # The guarantee therefore rests on the two `cache-from` scopes above being
      # hits rather than misses — which they almost always are, and which
      # nothing checked. A cache eviction between the jobs would publish an
      # image that was never booted and never scanned, and the run would be
      # green and silent about it. That silence is what this step removes.
      #
      # Diff IDs, not digests: this job adds OCI labels from metadata-action,
      # and a label changes the image config — so the config and manifest
      # digests differ from the scanned build's on every run, cache hit or not.
      # Diff IDs are the uncompressed hashes of the filesystem layers, which is
      # exactly "the same bytes" and is unaffected by labels or by the
      # provenance and SBOM manifests attached alongside.
      #
      # It warns rather than fails, deliberately. The push has already happened,
      # so failing here cannot unpublish anything — and a re-run would restore
      # from the same evicted cache and fail again, which is a red main branch
      # that no action clears. What the operator needs is to know the image is
      # unscanned so they can decide; that is a warning annotation and a row in
      # the summary, both of which this writes.
      #
      # Nothing here can fail the job on its own account either: an unreadable
      # manifest is reported as "not checked" rather than as a mismatch, so a
      # registry blip cannot be misread as a security finding. This is the same
      # rule the npm audit step above follows for the same reason.
      - name: Check the published layers are the ones that were scanned
        env:
          SCANNED_AMD64: ${{ needs.image.outputs.scanned-layers }}
          SCANNED_ARM64: ${{ needs.arm64.outputs.scanned-layers }}
          PUSHED: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          set -u

          # stdout only. Folding stderr in would let a buildx warning land in
          # front of the JSON and turn a perfectly good manifest into a "not
          # checked", which is the quiet failure this step is meant to remove
          # rather than add.
          config=$(docker buildx imagetools inspect "$PUSHED" --format '{{json .Image}}' 2>/dev/null) || config=''

          {
            echo '### Scanned-image check'
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$config" ] || ! printf '%s' "$config" | jq -e . >/dev/null 2>&1; then
            echo "::warning::could not read the published image config, so this run does not say whether the published layers are the scanned ones"
            echo 'Not checked — the published image config could not be read.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo '| platform | published layers |'
            echo '|---|---|'
          } >> "$GITHUB_STEP_SUMMARY"

          for platform in linux/amd64 linux/arm64; do
            case "$platform" in
              linux/amd64) scanned=$SCANNED_AMD64 ;;
              linux/arm64) scanned=$SCANNED_ARM64 ;;
            esac

            pushed=$(printf '%s' "$config" \
              | jq -c --arg p "$platform" 'if type=="object" and has($p) then .[$p].rootfs.diff_ids else null end' 2>/dev/null) \
              || pushed=null
            scanned=$(printf '%s' "$scanned" | jq -c . 2>/dev/null) || scanned=null

            # Empty as well as the literal `null`: jq exits 0 and prints nothing
            # when handed an empty stdin, which is what an upstream job that did
            # not run leaves in these variables. Read as a value it would
            # compare unequal to everything and report a mismatch — a false
            # alarm of exactly the kind this step must not raise.
            [ -z "$pushed" ] && pushed=null
            [ -z "$scanned" ] && scanned=null

            if [ "$pushed" = 'null' ] || [ "$scanned" = 'null' ]; then
              # One side is missing, which says nothing either way — an upstream
              # job that was skipped, or a manifest shape this cannot read.
              echo "::warning::$platform: nothing to compare, so it is unknown whether the published image is the scanned one"
              echo "| $platform | not checked |" >> "$GITHUB_STEP_SUMMARY"
            elif [ "$pushed" = "$scanned" ]; then
              echo "$platform: published layers are the ones that were scanned"
              echo "| $platform | match the scanned image |" >> "$GITHUB_STEP_SUMMARY"
            else
              # The case the whole step exists for. Say what it means, not just
              # that two strings differ — this line is read by whoever has to
              # decide whether to deploy the image.
              echo "::warning::$platform: the published image is NOT the one that was scanned. The build cache missed between the scan job and this one, so these layers were never booted or scanned. Re-run the workflow to rebuild and re-scan before deploying this tag."
              echo "  scanned: $scanned"
              echo "  pushed:  $pushed"
              echo "| $platform | **DO NOT DEPLOY** — rebuilt on a cache miss, never scanned |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      # The active half of the deploy signal (#953).
      #
      # `publish` repoints `:latest`, and that is where the story used to end: a
      # Portainer stack does not poll, so the new image sat in the registry
      # until somebody opened the UI and redeployed. Nothing announced that
      # there was anything to redeploy, which is how a published security fix
      # can stay undeployed for weeks.
      #
      # Opt-in, and off unless an operator sets the secret. Self-hosted
      # deployments are operator-driven by design — this repo has no idea where
      # anybody's Portainer is, and a workflow that assumed one would be wrong
      # for every fork. Portainer's stack webhook is a single URL that redeploys
      # the stack when POSTed to, which an operator creates in Portainer >
      # Stacks > Webhooks and pastes into the repository secret named here.
      # docs/RELEASING.md has the setup.
      #
      # Only on the default branch, because that is the only branch that moves
      # `:latest` (see `enable={{is_default_branch}}` in the tags above) and
      # `:latest` is what the stack pulls by default. A v* tag push publishes a
      # version tag nothing is pointed at until an operator chooses to be, so
      # firing a redeploy on one would deploy something they had not asked for.
      #
      # The URL is a deploy credential — anyone holding it can redeploy the
      # stack — so it is never echoed. `-o /dev/null` keeps the response body
      # out of the log for the same reason, since Portainer answers with the
      # stack definition.
      #
      # A failure here warns rather than fails the job. The image is published
      # and the scan passed, which is what this job is for; a Portainer that was
      # unreachable for thirty seconds is an operator's problem to retry, not a
      # reason to mark the build red and have somebody re-publish an image that
      # is already in the registry.
      - name: Tell the Portainer stack there is a new image
        if: env.PORTAINER_WEBHOOK_URL != '' && github.ref_name == github.event.repository.default_branch
        run: |
          set -u

          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            --request POST \
            --max-time 30 --retry 3 --retry-delay 5 --retry-connrefused \
            "$PORTAINER_WEBHOOK_URL" 2>/dev/null) || status=000

          case "$status" in
            2*)
              echo "Portainer accepted the redeploy request (HTTP $status)."
              echo 'Portainer stack webhook fired — the stack is pulling this image.' >> "$GITHUB_STEP_SUMMARY"
              ;;
            000)
              echo "::warning::could not reach the Portainer webhook. The image is published; redeploy the stack by hand."
              echo 'Portainer webhook unreachable — redeploy by hand.' >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              # 404 is the one worth calling out: Portainer invalidates a stack
              # webhook when the stack is recreated, so the commonest cause is a
              # secret still holding the URL of a stack that no longer exists.
              echo "::warning::the Portainer webhook answered HTTP $status. The image is published but the stack was not redeployed — check that PORTAINER_WEBHOOK_URL still names an existing stack."
              echo "Portainer webhook answered HTTP $status — redeploy by hand." >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac
