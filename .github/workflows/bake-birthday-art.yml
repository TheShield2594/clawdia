name: Bake birthday art

# Downloads the generated birthday embed art from the Higgsfield CDN and commits
# the normalized PNGs into src/assets/birthday/, where birthdayService serves
# them as the default author icon and banner (src/utils/birthdayFlair.js). Run
# manually against the branch that carries assets/birthday/birthday.map.json.
#
# It runs here rather than in a Claude Code sandbox because a GitHub-hosted
# runner can reach the CDN, and the sandbox's egress proxy cannot. It is
# idempotent: re-running re-fetches from the current map and overwrites, so
# regenerated art (a new job id in the map) is picked up on the next run.

on:
  workflow_dispatch:

concurrency:
  group: bake-birthday-art-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install sharp
        run: npm install --no-save sharp

      - name: Download and bake birthday art
        run: node assets/birthday/bake-birthday.mjs

      - name: Commit baked art
        run: |
          git config user.name "TheShield2594"
          git config user.email "82059300+TheShield2594@users.noreply.github.com"
          git add src/assets/birthday
          if git diff --cached --quiet; then
            echo "No birthday art changes to commit."
            exit 0
          fi
          git commit -m "Bake birthday art into src/assets/birthday (from birthday.map.json)"
          git push origin HEAD:${{ github.ref_name }}
