name: Bake item icons

# Downloads the generated icon catalogue from the Higgsfield CDN and commits the
# normalized PNGs into src/assets/item-icons/, where the app serves them as
# default item art (src/utils/defaultItemImages.js). Run manually against the
# branch that carries assets/icons/icons.map.json.
#
# It runs here rather than in a Claude Code sandbox because a GitHub-hosted
# runner can reach the CDN, and the sandbox's egress proxy cannot. It is
# idempotent: re-running re-fetches from the current map and overwrites, so
# regenerated icons (new job ids in the map) are picked up on the next run.

on:
  workflow_dispatch:

concurrency:
  group: bake-item-icons-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          # The write token is handed only to the final push step, so it is not
          # sitting in .git/config while third-party install scripts run.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install sharp
        # Pinned: sharp is not in package-lock.json, so an unpinned install would run
        # whatever the latest release's install scripts are.
        run: npm install --no-save sharp@0.35.4

      - name: Download and bake icons
        run: node assets/icons/bake-icons.mjs

      - name: Commit baked icons
        env:
          # Passed through env so the branch name is never parsed as shell.
          REF: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "TheShield2594"
          git config user.email "82059300+TheShield2594@users.noreply.github.com"
          git add src/assets/item-icons
          if git diff --cached --quiet; then
            echo "No icon changes to commit."
            exit 0
          fi
          git commit -m "Bake item icons into src/assets/item-icons (from icons.map.json)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${REF}"
