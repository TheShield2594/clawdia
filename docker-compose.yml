services:
  mongodb:
    # Digest-pinned so the same stack file always deploys the same mongod (#644);
    # `mongo:7` alone is re-published on every 7.x patch. Bumped by Dependabot,
    # held by tests/imagePinning.test.js. The tag stays for readability — Docker
    # resolves the digest.
    image: mongo:7@sha256:b6421fd6d1c5ded6377b397d8983e2f82e2100dc5123332dcfda2065a472be5b
    container_name: clawdia-mongodb
    restart: unless-stopped
    # Authentication (#648). The internal-only network keeps the outside world
    # away from mongod, but on its own it is the *only* control: any container
    # that joins db-network gets full, credential-less database access. Setting
    # MONGODB_ROOT_USERNAME + MONGODB_ROOT_PASSWORD in .env closes that — the
    # mongo image creates the root user and starts mongod with --auth — and
    # MONGODB_APP_USERNAME + MONGODB_APP_PASSWORD makes scripts/mongo-init.js
    # create the dedicated low-privilege user the bot should actually connect
    # as (readWrite on ultrabot, nothing else). Then point MONGODB_URI at it:
    #
    #   MONGODB_URI=mongodb://appuser:apppass@mongodb:27017/ultrabot?authSource=ultrabot
    #
    # All four variables take effect ONLY on the first start against an empty
    # mongodb_data volume; the image skips initialization when data exists. To
    # enable auth on a deployment that already has data, see "Enabling MongoDB
    # authentication" in docs/SETUP_GUIDE.md — it is a few mongosh commands, not a
    # wipe. Left unset, everything behaves exactly as before (no auth), so
    # existing deployments keep starting; new ones should set all four.
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME:-}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:-}
      MONGODB_APP_USERNAME: ${MONGODB_APP_USERNAME:-}
      MONGODB_APP_PASSWORD: ${MONGODB_APP_PASSWORD:-}
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - db-network   # internal-only: no external routing, no published ports
    healthcheck:
      # `ping` is deliberately one of the commands mongod answers without
      # authentication, so this probe keeps working with auth enabled.
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # Unbounded, mongod sizes its WiredTiger cache from *host* RAM — half of
    # (host RAM - 1g) — so on a big host it will happily grow past anything the
    # bot leaves it and take the machine down with it. mongod reads the cgroup
    # limit, so this ceiling is also what tells it to cap the cache at the 256m
    # floor. Raise both together if the working set outgrows it.
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g

  bot:
    build: .
    # Tag the local build with the same name portainer-stack.yml pulls, so
    # `docker compose build` produces the image the production stack expects
    # and `docker compose push` publishes it.
    image: ghcr.io/theshield2594/clawdia:${CLAWDIA_IMAGE_TAG:-latest}
    container_name: clawdia
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # An irreversible migration is forward-only, so the mongodump the runner
      # takes immediately before one is the only way back from it — which is
      # what the `backups` mount below is for. Unset, that dump is best-effort:
      # a failure is a warning and the destructive step runs anyway. `require`
      # makes a failed or impossible backup abort the boot instead, which is
      # the setting to want when the dump is your rollback plan.
      #
      # Defaulted here rather than in .env.example so an operator who never
      # opened that section still gets it. Set MIGRATION_BACKUP in .env to
      # override — including back to the warn-and-continue behaviour.
      MIGRATION_BACKUP: ${MIGRATION_BACKUP:-require}
      # Everything in .env arrives as a plain container environment variable,
      # and those are readable by anyone who can reach the Docker API: `docker
      # inspect clawdia` prints the bot token and every provider key in full,
      # no shell in the container required. To keep them out of it, deliver
      # each secret as a file instead — every secret variable also accepts a
      # <NAME>_FILE form naming a file to read the value from
      # (src/config/fileSecrets.js).
      #
      # To switch over: create ./secrets/discord_token (etc.), remove the plain
      # variable from .env, and uncomment the matching lines here and the
      # top-level `secrets:` block at the bottom of this file. If both forms
      # are set the plain variable wins and the file is ignored, so the
      # migration can be done one secret at a time.
      # DISCORD_TOKEN_FILE: /run/secrets/discord_token
      # CLIENT_SECRET_FILE: /run/secrets/client_secret
      # SESSION_SECRET_FILE: /run/secrets/session_secret
      # The `backup` service reads MONGODB_URI too; uncomment the matching
      # lines on it so both sides come from the same secret.
      # MONGODB_URI_FILE: /run/secrets/mongodb_uri
      # Opens the per-guild AI provider keys stored in the database (#564).
      # SECRET_ENCRYPTION_KEY_FILE: /run/secrets/secret_encryption_key
      # ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
      # OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      # GEMINI_API_KEY_FILE: /run/secrets/gemini_api_key
      # OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
    # secrets:
    #   - discord_token
    #   - client_secret
    #   - session_secret
    #   - mongodb_uri
    #   - secret_encryption_key
    #   - anthropic_api_key
    #   - openai_api_key
    #   - gemini_api_key
    #   - openrouter_api_key
    # Bound to loopback only. DASHBOARD_URL is required to be HTTPS in
    # production, which means a TLS-terminating reverse proxy sits in front of
    # this; publishing on 0.0.0.0 would also expose the dashboard directly over
    # plaintext HTTP, bypassing it. Drop the "127.0.0.1:" prefix only if you are
    # deliberately terminating TLS elsewhere on the host network.
    #
    # DASHBOARD_PORT is the container's side and should normally stay 3000, which
    # is what the image EXPOSEs and what its own HEALTHCHECK probes.
    # DASHBOARD_HOST_PORT is the host's side and is yours to pick.
    #
    # With the `split-dashboard` profile on, this container serves no dashboard
    # and the `dashboard` service publishes the same host port instead. Comment
    # this mapping out then — two services cannot both publish it, and the bot's
    # facade port is deliberately never published at all.
    ports:
      - "127.0.0.1:${DASHBOARD_HOST_PORT:-3000}:${DASHBOARD_PORT:-3000}"
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backups:/app/backups
      # MCP server list, read at startup. Mounted rather than baked into the
      # image so the file (which can hold OAuth tokens) stays on the host.
      - ./config:/app/config:ro
    networks:
      - db-network      # reaches MongoDB
      - clawdia-network # reaches the internet (Discord API, AI APIs, etc.)
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    # Dedicated JSON health endpoint. The probe reads `status` out of the body
    # rather than looking at the HTTP code, and fails only on `unhealthy` —
    # MongoDB down, so the bot can neither read nor write anything, which is the
    # one state a restart is worth trying on.
    #
    # `degraded` (mongo up, a scheduled service failing every run) answers 503
    # but is deliberately *not* a healthcheck failure: restarting the process
    # does not fix a feed that is 404ing, and the restart loop would be worse
    # than the degraded state. It is a page-a-human signal, which is what the
    # uptime monitor described in README's Monitoring section is for.
    healthcheck:
      test: ["CMD", "node", "-e",
        "require('http').get('http://127.0.0.1:' + (process.env.DASHBOARD_PORT || 3000) + '/health', (r) => { let b=''; r.on('data', d => b+=d); r.on('end', () => { try { const s = JSON.parse(b).status; process.exit(s === 'unhealthy' ? 1 : 0); } catch { process.exit(1); } }); }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    # Compose v2 applies `limits` to the container's cgroup on a plain
    # `docker compose up`. `reservations` is a scheduling hint that only Swarm
    # acts on: it is kept as a record of the intended floor, not as something
    # the daemon enforces here.
    deploy:
      resources:
        limits:
          # Canvas rendering (shop banners, profile cards, the 8ball image) is
          # synchronous and single-threaded, so a burst of those commands pegs a
          # core for as long as it takes. With no ceiling that contends with
          # mongod and anything else sharing the host; two cores lets a render
          # run flat out while the event loop keeps answering on the other.
          cpus: '2.0'
          memory: 1g
        reservations:
          memory: 256m
    stop_grace_period: 30s
    labels:
      # Read by the optional `autoheal` service below. Harmless when that
      # service is not running, which is why it is not commented out: enabling
      # autoheal is then one flag, with nothing to remember to uncomment here.
      autoheal: "true"

  # The dashboard, as its own container. Off by default (#876).
  #
  #   docker compose --profile split-dashboard up -d
  #
  # Embedded, the dashboard shares an event loop with the Discord gateway, the
  # cron jobs, canvas rendering and every full-collection aggregation — so a
  # heavy dashboard request delays heartbeats for every guild, and a fault in a
  # route reaches the process guards in src/index.js, which exit. That makes a
  # bad page a bot-wide outage.
  #
  # Split, this container serves the dashboard and the `bot` container serves it
  # the handful of things only a gateway connection can answer, over
  # BOT_GATEWAY_URL. Turning it on takes three variables in .env:
  #
  #   BOT_GATEWAY_PORT=3001                 # the bot serves the facade here
  #   BOT_GATEWAY_URL=http://clawdia:3001   # where this container finds it
  #   BOT_GATEWAY_TOKEN=<openssl rand -hex 32>
  #
  # Setting BOT_GATEWAY_PORT is what stops the bot starting its own dashboard,
  # so the two never both bind a port. Leave the variables unset and this
  # service does not run and nothing else changes.
  dashboard:
    profiles: [split-dashboard]
    build: .
    image: ghcr.io/theshield2594/clawdia:${CLAWDIA_IMAGE_TAG:-latest}
    container_name: clawdia-dashboard
    restart: unless-stopped
    # The same image, a different entry point. There is no second build, and no
    # way for the two to drift to different versions of the shared code.
    command: ["node", "src/dashboard/index.js"]
    env_file:
      - .env
    ports:
      - "127.0.0.1:${DASHBOARD_HOST_PORT:-3000}:${DASHBOARD_PORT:-3000}"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - db-network      # reads the database it owns directly
      - clawdia-network # reaches the bot's gateway endpoint, and Discord OAuth
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    # BOT_GATEWAY_PORT is set for this container too (it comes from the shared
    # .env), so the image's own healthcheck would probe a port this process does
    # not serve. Overridden to the dashboard's port, which is the one it binds.
    healthcheck:
      test: ["CMD", "node", "-e",
        "require('http').get('http://127.0.0.1:' + (process.env.DASHBOARD_PORT || 3000) + '/health', (r) => { let b=''; r.on('data', d => b+=d); r.on('end', () => { try { const s = JSON.parse(b).status; process.exit(s === 'unhealthy' ? 1 : 0); } catch { process.exit(1); } }); }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Lighter than the bot's: no canvas rendering, no gateway, no cron jobs.
    # Rendering guild-settings.ejs is the heaviest thing it does.
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512m
        reservations:
          memory: 128m
    stop_grace_period: 15s
    labels:
      autoheal: "true"

  # Optional container-level self-healing, off by default:
  #
  #   docker compose --profile autoheal up -d
  #
  # `restart: unless-stopped` restarts a container whose process *exited*. It
  # does nothing about a container that is up and failing its healthcheck —
  # outside Swarm, Docker records `unhealthy` and stops there — so an unhealthy
  # bot used to sit unhealthy indefinitely with nothing acting on it (#640).
  # This watches the daemon for that state and restarts the containers labelled
  # `autoheal=true`.
  #
  # It is opt-in because of what it costs: the container holds the Docker API,
  # and anything that can reach the Docker API can read every environment
  # variable of every container on the host — `docker inspect clawdia` prints
  # the bot token and each provider key in full. If you enable this, deliver the
  # secrets as files (the <NAME>_FILE form documented on the bot service above)
  # so there is nothing in the environment worth reading.
  #
  # The alternative, with no socket involved, is the external uptime monitor in
  # README's Monitoring section: it sees the same state over HTTP and pages a
  # human instead of restarting on its own.
  autoheal:
    image: willfarrell/autoheal:1.2.0@sha256:31f580ef0279eaced5b38d631b08c474d70d8403c1c2fdd6ddcf2e879d5f3f7c
    container_name: clawdia-autoheal
    profiles:
      - autoheal
    restart: unless-stopped
    environment:
      # Only containers carrying the label, never every unhealthy container on
      # the host — this stack is not necessarily the only thing running here.
      AUTOHEAL_CONTAINER_LABEL: autoheal
      # Long enough that a bot still inside `start_period` is never a candidate.
      AUTOHEAL_START_PERIOD: '120'
      AUTOHEAL_INTERVAL: '30'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # It talks to the daemon over the unix socket and to nothing else, so it
    # needs no network at all — including not the default bridge.
    network_mode: none

  # Scheduled backup: mongodump once a day at 03:00 UTC into ./backups, keeping
  # BACKUP_RETENTION_DAYS (30) days.
  #
  # On by default. It used to sit behind `profiles: [backup]`, which meant a
  # plain `docker compose up -d` ran the bot with no backups at all — and the
  # migration runner's own pre-migration dump is one archive at one moment, not
  # a history. Set BACKUP_RETENTION_DAYS to tune retention; to opt out entirely,
  # `docker compose up -d --scale backup=0`.
  backup:
    image: mongo:7@sha256:b6421fd6d1c5ded6377b397d8983e2f82e2100dc5123332dcfda2065a472be5b
    container_name: clawdia-backup
    restart: unless-stopped
    # Three variables, named one at a time — no `env_file: .env` here (#901). This
    # is a stock mongo image that dumps a database; handing it the whole .env
    # put the Discord bot token, the session secret and every AI provider key
    # into a container with no use for any of them, readable from `docker
    # inspect` and from the container's own environment. portainer-stack.yml
    # always passed just the ones it needs, so this is the parity gap as well
    # as the exposure. tests/deployStackParity.test.js holds both files to it.
    #
    # The `${...}` defaults below still read .env — Compose interpolates the
    # file it finds beside docker-compose.yml whatever any service declares —
    # so nothing about how a deploy is configured changes.
    environment:
      # .env normally supplies this; the default matches portainer-stack.yml so
      # a checkout without MONGODB_URI still backs up the right database
      # instead of exiting at boot.
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/ultrabot}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      # The third, and the reason the rule above is "nothing it has no use for"
      # rather than "two variables": a backup that fails silently is the whole
      # of #899, and this is where the entrypoint sends the failure. Unset —
      # the default — it logs and nothing else, exactly as before.
      ERROR_WEBHOOK_URL: ${ERROR_WEBHOOK_URL:-}
      # Mirrors the bot's MONGODB_URI_FILE. This is a stock mongo image with no
      # loader of its own, so the entrypoint below reads the file itself — and
      # prefers it over MONGODB_URI, so the mapping above can stay exactly as
      # it is. Uncomment this line and the `secrets:` block below together.
      # MONGODB_URI_FILE: /run/secrets/mongodb_uri
    # secrets:
    #   - mongodb_uri
    volumes:
      - ./backups:/backups
    networks:
      - db-network   # only needs to reach MongoDB
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint: >
      sh -c '
        if [ -n "$$MONGODB_URI_FILE" ]; then
          if [ ! -r "$$MONGODB_URI_FILE" ]; then
            echo "[backup] MONGODB_URI_FILE=$$MONGODB_URI_FILE is not readable"; exit 1;
          fi;
          MONGODB_URI=$$(tr -d "\r\n" < "$$MONGODB_URI_FILE");
          if [ -z "$$MONGODB_URI" ]; then
            echo "[backup] MONGODB_URI_FILE=$$MONGODB_URI_FILE is empty"; exit 1;
          fi;
          export MONGODB_URI;
          echo "[backup] Read MONGODB_URI from $$MONGODB_URI_FILE";
        fi;
        if [ -z "$$MONGODB_URI" ]; then
          echo "[backup] Neither MONGODB_URI nor MONGODB_URI_FILE is set"; exit 1;
        fi;
        RETAIN=$${BACKUP_RETENTION_DAYS:-30};
        # Two files the loop keeps in the backup directory, both of them for
        # something outside the container to read (#899). STATUS is for a human
        # asking "what happened last night"; OK_MARKER carries no content at all
        # and exists only so the healthcheck below has an mtime to compare
        # against. They are separate because the healthcheck must not go green
        # for a run that failed, and a single file would have to be parsed to
        # tell those apart.
        STATUS=/backups/.backup-status;
        OK_MARKER=/backups/.backup-ok;
        # A failure that only reaches the log reaches nobody: this container is
        # not the one anybody tails. ERROR_WEBHOOK_URL is the sink the bot
        # already reports crashes to (src/utils/errorReporter.js), and a Discord
        # webhook gets Discord shape for the same reason it does there — that is
        # the sink the operator of a Discord bot already has.
        notify() {
          echo "[backup] $$1";
          if [ -z "$$ERROR_WEBHOOK_URL" ]; then return 0; fi;
          if ! command -v curl >/dev/null 2>&1; then
            echo "[backup] curl is not present in this image; ERROR_WEBHOOK_URL not posted"; return 0;
          fi;
          case "$$ERROR_WEBHOOK_URL" in
            https://discord.com/api/webhooks/*|https://discordapp.com/api/webhooks/*)
              BODY="{\"content\":\"**backup failed** on clawdia-backup: $$1\"}";;
            *)
              BODY="{\"kind\":\"backup_failed\",\"service\":\"clawdia-backup\",\"message\":\"$$1\"}";;
          esac;
          # Never fatal, and never blocking for long: the next run matters more
          # than this post landing.
          curl -fsS --max-time 10 -X POST -H "content-type: application/json" -d "$$BODY" "$$ERROR_WEBHOOK_URL" >/dev/null 2>&1 ||
            echo "[backup] posting to ERROR_WEBHOOK_URL failed";
        };
        prune() {
          # Prunes the old ultrabot-* prefix too, so archives written before the
          # rename are still aged out instead of accumulating forever. The bot
          # lands pre-migration-*.gz in the same directory; those are pruned
          # on the same schedule.
          find /backups \( -name "clawdia-*.gz" -o -name "clawdia-*.gz.unverified" -o -name "ultrabot-*.gz" -o -name "pre-migration-*.gz" \) -mtime +$$RETAIN -delete;
        };
        run_backup() {
          TIMESTAMP=$$(date -u +"%Y%m%dT%H%M%SZ");
          ARCHIVE=/backups/clawdia-$$TIMESTAMP.gz;
          echo "[backup] Starting backup at $$TIMESTAMP";
          if ! mongodump --uri="$$MONGODB_URI" --gzip --archive="$$ARCHIVE"; then
            echo "dump-failed $$TIMESTAMP" > "$$STATUS";
            notify "mongodump exited non-zero at $$TIMESTAMP; no archive was written";
            return 1;
          fi;
          # Exit status 0 says mongodump ran, not that what it wrote can be read
          # back — a truncated archive from a full disk or a killed process is
          # the failure that stays invisible until the restore. --dryRun reads
          # and parses the whole archive and writes nothing, so every archive is
          # at least known to be parseable on the day it was taken. It is not a
          # restore rehearsal: for that, scripts/verify-backup.sh restores into a
          # scratch database and compares document counts, which needs
          # privileges this container deliberately does not have.
          if ! mongorestore --uri="$$MONGODB_URI" --gzip --archive="$$ARCHIVE" --dryRun --quiet; then
            # Renamed rather than kept or deleted. Kept under its own name, an
            # unreadable archive is what --latest picks up and what the boot
            # catch-up counts as this day's backup; deleted, an operator has
            # nothing to look at, and the check can fail for reasons that are
            # not the archive (mongorestore has to reach the server for --dryRun
            # too). The suffix keeps it off both globs and inside the prune.
            mv "$$ARCHIVE" "$$ARCHIVE.unverified";
            echo "verify-failed $$TIMESTAMP $$ARCHIVE.unverified" > "$$STATUS";
            notify "archive $$TIMESTAMP did not parse back; kept as $$ARCHIVE.unverified and not counted as a backup";
            return 1;
          fi;
          echo "ok $$TIMESTAMP $$ARCHIVE" > "$$STATUS";
          touch "$$OK_MARKER";
          echo "[backup] Done: $$ARCHIVE";
        };
        # A container that was not running at 03:00 — a host reboot, an image
        # pull, a stack redeploy — used to skip the whole day and say nothing.
        # With the healthcheck now asserting a fresh archive, that gap would
        # read as a fault, so close it instead of reporting it: catch up on
        # boot whenever the newest archive is over a day old.
        if [ -z "$$(find /backups -name "clawdia-*.gz" -mmin -1440 2>/dev/null)" ]; then
          echo "[backup] No archive from the last 24h; backing up now instead of waiting for 03:00";
          run_backup || true;
          prune;
        fi;
        while true; do
          # Recomputed every iteration. A fixed `sleep 86400` after the dump
          # would start each run later than the last by however long the dump
          # and the prune took, walking 03:00 into working hours over a month.
          NOW=$$(date -u +%s);
          MIDNIGHT=$$(( ($$NOW / 86400) * 86400 ));
          TARGET=$$(( $$MIDNIGHT + 10800 ));
          if [ $$NOW -ge $$TARGET ]; then TARGET=$$(( $$TARGET + 86400 )); fi;
          SLEEP=$$(( $$TARGET - $$NOW ));
          echo "[backup] Sleeping $${SLEEP}s until next 03:00 UTC";
          sleep $$SLEEP;
          run_backup || true;
          prune;
        done'
    healthcheck:
      # Not "is the process alive" — it always is. The loop caught its own
      # failures with an `|| echo FAILED` into a log nobody reads, and the
      # container stayed Up, so `docker ps` and every dashboard showed green
      # while the backups rotted (#899). What is worth asserting is the
      # artifact, not the process: a run that finished AND parsed back inside
      # the last 26h. 26 rather than 24 leaves the dump itself room to run long
      # without flapping the container between healthy and unhealthy.
      test: ["CMD-SHELL", "find /backups/.backup-ok -mmin -1560 2>/dev/null | grep -q ."]
      interval: 1h
      timeout: 10s
      retries: 2
      # Only has to cover the boot catch-up above, which starts within seconds
      # of the container coming up. An hour is for the dump, not the wait.
      start_period: 1h

# Host files mounted read-only at /run/secrets/<name> inside the container.
# Keep ./secrets/ out of git (it already is, via .gitignore) and chmod 0400 the
# files. Uncomment alongside the service block above.
# Declare only the ones you actually create — compose fails the deploy for a
# declared secret whose file is missing, and a service must not list one that
# was never declared. Drop the lines for secrets you are not using.
# secrets:
#   discord_token:
#     file: ./secrets/discord_token
#   client_secret:
#     file: ./secrets/client_secret
#   session_secret:
#     file: ./secrets/session_secret
#   mongodb_uri:
#     file: ./secrets/mongodb_uri
#   secret_encryption_key:
#     file: ./secrets/secret_encryption_key
#   anthropic_api_key:
#     file: ./secrets/anthropic_api_key
#   openai_api_key:
#     file: ./secrets/openai_api_key
#   gemini_api_key:
#     file: ./secrets/gemini_api_key
#   openrouter_api_key:
#     file: ./secrets/openrouter_api_key

volumes:
  mongodb_data:

networks:
  clawdia-network:
    driver: bridge
  db-network:
    driver: bridge
    internal: true  # no external gateway — MongoDB cannot initiate outbound connections
