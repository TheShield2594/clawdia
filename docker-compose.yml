services:
  mongodb:
    image: mongo:7
    container_name: ultrabot-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - db-network   # internal-only: no external routing, no published ports
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  bot:
    build: .
    container_name: ultrabot
    restart: unless-stopped
    env_file:
      - .env
    # Bound to loopback only. DASHBOARD_URL is required to be HTTPS in
    # production, which means a TLS-terminating reverse proxy sits in front of
    # this; publishing on 0.0.0.0 would also expose the dashboard directly over
    # plaintext HTTP, bypassing it. Change to "3000:3000" only if you are
    # deliberately terminating TLS elsewhere on the host network.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backups:/app/backups
    networks:
      - db-network      # reaches MongoDB
      - ultrabot-network # reaches the internet (Discord API, AI APIs, etc.)
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    # Dedicated JSON health endpoint; 503 when mongo is down
    healthcheck:
      test: ["CMD", "node", "-e",
        "require('http').get('http://localhost:3000/health', (r) => { let b=''; r.on('data', d => b+=d); r.on('end', () => { try { const s = JSON.parse(b).status; process.exit(s === 'unhealthy' ? 1 : 0); } catch { process.exit(1); } }); }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m
    stop_grace_period: 30s

  # Optional scheduled backup (runs mongodump once a day at 03:00 UTC)
  backup:
    image: mongo:7
    container_name: ultrabot-backup
    profiles:
      - backup
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backups:/backups
    networks:
      - db-network   # only needs to reach MongoDB
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint: >
      sh -c '
        NOW=$$(date -u +%s);
        MIDNIGHT=$$(( ($$NOW / 86400) * 86400 ));
        TARGET=$$(( $$MIDNIGHT + 10800 ));
        if [ $$NOW -ge $$TARGET ]; then TARGET=$$(( $$TARGET + 86400 )); fi;
        SLEEP=$$(( $$TARGET - $$NOW ));
        echo "[backup] Sleeping $${SLEEP}s until next 03:00 UTC";
        sleep $$SLEEP;
        while true; do
          TIMESTAMP=$$(date -u +"%Y%m%dT%H%M%SZ");
          echo "[backup] Starting backup at $$TIMESTAMP";
          mongodump --uri="$$MONGODB_URI" --gzip --archive="/backups/ultrabot-$$TIMESTAMP.gz" &&
            echo "[backup] Done: /backups/ultrabot-$$TIMESTAMP.gz" ||
            echo "[backup] FAILED";
          find /backups -name "ultrabot-*.gz" -mtime +30 -delete;
          sleep 86400;
        done'

volumes:
  mongodb_data:

networks:
  ultrabot-network:
    driver: bridge
  db-network:
    driver: bridge
    internal: true  # no external gateway — MongoDB cannot initiate outbound connections
