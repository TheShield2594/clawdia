services:
  mongodb:
    image: mongo:7
    container_name: clawdia-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - db-network   # internal-only: no external routing, no published ports
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # Unbounded, mongod sizes its WiredTiger cache from *host* RAM — half of
    # (host RAM - 1g) — so on a big host it will happily grow past anything the
    # bot leaves it and take the machine down with it. mongod reads the cgroup
    # limit, so this ceiling is also what tells it to cap the cache at the 256m
    # floor. Raise both together if the working set outgrows it.
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g

  bot:
    build: .
    container_name: clawdia
    restart: unless-stopped
    env_file:
      - .env
    # Bound to loopback only. DASHBOARD_URL is required to be HTTPS in
    # production, which means a TLS-terminating reverse proxy sits in front of
    # this; publishing on 0.0.0.0 would also expose the dashboard directly over
    # plaintext HTTP, bypassing it. Change to "3000:3000" only if you are
    # deliberately terminating TLS elsewhere on the host network.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backups:/app/backups
      # MCP server list, read at startup. Mounted rather than baked into the
      # image so the file (which can hold OAuth tokens) stays on the host.
      - ./config:/app/config:ro
    networks:
      - db-network      # reaches MongoDB
      - clawdia-network # reaches the internet (Discord API, AI APIs, etc.)
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    # Dedicated JSON health endpoint; 503 when mongo is down
    healthcheck:
      test: ["CMD", "node", "-e",
        "require('http').get('http://localhost:3000/health', (r) => { let b=''; r.on('data', d => b+=d); r.on('end', () => { try { const s = JSON.parse(b).status; process.exit(s === 'unhealthy' ? 1 : 0); } catch { process.exit(1); } }); }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    # Compose v2 applies `limits` to the container's cgroup on a plain
    # `docker compose up`. `reservations` is a scheduling hint that only Swarm
    # acts on: it is kept as a record of the intended floor, not as something
    # the daemon enforces here.
    deploy:
      resources:
        limits:
          # Canvas rendering (shop banners, profile cards, the 8ball image) is
          # synchronous and single-threaded, so a burst of those commands pegs a
          # core for as long as it takes. With no ceiling that contends with
          # mongod and anything else sharing the host; two cores lets a render
          # run flat out while the event loop keeps answering on the other.
          cpus: '2.0'
          memory: 1g
        reservations:
          memory: 256m
    stop_grace_period: 30s

  # Optional scheduled backup (runs mongodump once a day at 03:00 UTC)
  backup:
    image: mongo:7
    container_name: clawdia-backup
    profiles:
      - backup
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backups:/backups
    networks:
      - db-network   # only needs to reach MongoDB
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint: >
      sh -c '
        NOW=$$(date -u +%s);
        MIDNIGHT=$$(( ($$NOW / 86400) * 86400 ));
        TARGET=$$(( $$MIDNIGHT + 10800 ));
        if [ $$NOW -ge $$TARGET ]; then TARGET=$$(( $$TARGET + 86400 )); fi;
        SLEEP=$$(( $$TARGET - $$NOW ));
        echo "[backup] Sleeping $${SLEEP}s until next 03:00 UTC";
        sleep $$SLEEP;
        while true; do
          TIMESTAMP=$$(date -u +"%Y%m%dT%H%M%SZ");
          echo "[backup] Starting backup at $$TIMESTAMP";
          mongodump --uri="$$MONGODB_URI" --gzip --archive="/backups/clawdia-$$TIMESTAMP.gz" &&
            echo "[backup] Done: /backups/clawdia-$$TIMESTAMP.gz" ||
            echo "[backup] FAILED";
          # Prunes the old ultrabot-* prefix too, so archives written before the
          # rename are still aged out instead of accumulating forever.
          find /backups \( -name "clawdia-*.gz" -o -name "ultrabot-*.gz" \) -mtime +30 -delete;
          sleep 86400;
        done'

volumes:
  mongodb_data:

networks:
  clawdia-network:
    driver: bridge
  db-network:
    driver: bridge
    internal: true  # no external gateway — MongoDB cannot initiate outbound connections
