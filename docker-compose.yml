services:
  mongodb:
    image: mongo:7
    container_name: clawdia-mongodb
    restart: unless-stopped
    # Authentication (#648). The internal-only network keeps the outside world
    # away from mongod, but on its own it is the *only* control: any container
    # that joins db-network gets full, credential-less database access. Setting
    # MONGODB_ROOT_USERNAME + MONGODB_ROOT_PASSWORD in .env closes that — the
    # mongo image creates the root user and starts mongod with --auth — and
    # MONGODB_APP_USERNAME + MONGODB_APP_PASSWORD makes scripts/mongo-init.js
    # create the dedicated low-privilege user the bot should actually connect
    # as (readWrite on ultrabot, nothing else). Then point MONGODB_URI at it:
    #
    #   MONGODB_URI=mongodb://appuser:apppass@mongodb:27017/ultrabot?authSource=ultrabot
    #
    # All four variables take effect ONLY on the first start against an empty
    # mongodb_data volume; the image skips initialization when data exists. To
    # enable auth on a deployment that already has data, see "Enabling MongoDB
    # authentication" in SETUP_GUIDE.md — it is a few mongosh commands, not a
    # wipe. Left unset, everything behaves exactly as before (no auth), so
    # existing deployments keep starting; new ones should set all four.
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME:-}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:-}
      MONGODB_APP_USERNAME: ${MONGODB_APP_USERNAME:-}
      MONGODB_APP_PASSWORD: ${MONGODB_APP_PASSWORD:-}
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - db-network   # internal-only: no external routing, no published ports
    healthcheck:
      # `ping` is deliberately one of the commands mongod answers without
      # authentication, so this probe keeps working with auth enabled.
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # Unbounded, mongod sizes its WiredTiger cache from *host* RAM — half of
    # (host RAM - 1g) — so on a big host it will happily grow past anything the
    # bot leaves it and take the machine down with it. mongod reads the cgroup
    # limit, so this ceiling is also what tells it to cap the cache at the 256m
    # floor. Raise both together if the working set outgrows it.
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g

  bot:
    build: .
    # Tag the local build with the same name portainer-stack.yml pulls, so
    # `docker compose build` produces the image the production stack expects
    # and `docker compose push` publishes it.
    image: ghcr.io/theshield2594/clawdia:${CLAWDIA_IMAGE_TAG:-latest}
    container_name: clawdia
    restart: unless-stopped
    env_file:
      - .env
    # Everything in .env arrives as a plain container environment variable, and
    # those are readable by anyone who can reach the Docker API: `docker inspect
    # clawdia` prints the bot token and every provider key in full, no shell in
    # the container required. To keep them out of it, deliver each secret as a
    # file instead — every secret variable also accepts a <NAME>_FILE form
    # naming a file to read the value from (src/config/fileSecrets.js).
    #
    # To switch over: create ./secrets/discord_token (etc.), remove the plain
    # variable from .env, and uncomment the matching lines here and the
    # top-level `secrets:` block at the bottom of this file. If both forms are
    # set the plain variable wins and the file is ignored, so the migration can
    # be done one secret at a time.
    # environment:
    #   DISCORD_TOKEN_FILE: /run/secrets/discord_token
    #   CLIENT_SECRET_FILE: /run/secrets/client_secret
    #   SESSION_SECRET_FILE: /run/secrets/session_secret
    #   # The `backup` service reads MONGODB_URI too; uncomment the matching
    #   # lines on it so both sides come from the same secret.
    #   MONGODB_URI_FILE: /run/secrets/mongodb_uri
    #   # Opens the per-guild AI provider keys stored in the database (#564).
    #   SECRET_ENCRYPTION_KEY_FILE: /run/secrets/secret_encryption_key
    #   ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
    #   OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
    #   GEMINI_API_KEY_FILE: /run/secrets/gemini_api_key
    #   OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
    # secrets:
    #   - discord_token
    #   - client_secret
    #   - session_secret
    #   - mongodb_uri
    #   - secret_encryption_key
    #   - anthropic_api_key
    #   - openai_api_key
    #   - gemini_api_key
    #   - openrouter_api_key
    # Bound to loopback only. DASHBOARD_URL is required to be HTTPS in
    # production, which means a TLS-terminating reverse proxy sits in front of
    # this; publishing on 0.0.0.0 would also expose the dashboard directly over
    # plaintext HTTP, bypassing it. Drop the "127.0.0.1:" prefix only if you are
    # deliberately terminating TLS elsewhere on the host network.
    #
    # DASHBOARD_PORT is the container's side and should normally stay 3000, which
    # is what the image EXPOSEs and what its own HEALTHCHECK probes.
    # DASHBOARD_HOST_PORT is the host's side and is yours to pick.
    ports:
      - "127.0.0.1:${DASHBOARD_HOST_PORT:-3000}:${DASHBOARD_PORT:-3000}"
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backups:/app/backups
      # MCP server list, read at startup. Mounted rather than baked into the
      # image so the file (which can hold OAuth tokens) stays on the host.
      - ./config:/app/config:ro
    networks:
      - db-network      # reaches MongoDB
      - clawdia-network # reaches the internet (Discord API, AI APIs, etc.)
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    # Dedicated JSON health endpoint. The probe reads `status` out of the body
    # rather than looking at the HTTP code, and fails only on `unhealthy` —
    # MongoDB down, so the bot can neither read nor write anything, which is the
    # one state a restart is worth trying on.
    #
    # `degraded` (mongo up, a scheduled service failing every run) answers 503
    # but is deliberately *not* a healthcheck failure: restarting the process
    # does not fix a feed that is 404ing, and the restart loop would be worse
    # than the degraded state. It is a page-a-human signal, which is what the
    # uptime monitor described in README's Monitoring section is for.
    healthcheck:
      test: ["CMD", "node", "-e",
        "require('http').get('http://127.0.0.1:' + (process.env.DASHBOARD_PORT || 3000) + '/health', (r) => { let b=''; r.on('data', d => b+=d); r.on('end', () => { try { const s = JSON.parse(b).status; process.exit(s === 'unhealthy' ? 1 : 0); } catch { process.exit(1); } }); }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    # Compose v2 applies `limits` to the container's cgroup on a plain
    # `docker compose up`. `reservations` is a scheduling hint that only Swarm
    # acts on: it is kept as a record of the intended floor, not as something
    # the daemon enforces here.
    deploy:
      resources:
        limits:
          # Canvas rendering (shop banners, profile cards, the 8ball image) is
          # synchronous and single-threaded, so a burst of those commands pegs a
          # core for as long as it takes. With no ceiling that contends with
          # mongod and anything else sharing the host; two cores lets a render
          # run flat out while the event loop keeps answering on the other.
          cpus: '2.0'
          memory: 1g
        reservations:
          memory: 256m
    stop_grace_period: 30s
    labels:
      # Read by the optional `autoheal` service below. Harmless when that
      # service is not running, which is why it is not commented out: enabling
      # autoheal is then one flag, with nothing to remember to uncomment here.
      autoheal: "true"

  # Optional container-level self-healing, off by default:
  #
  #   docker compose --profile autoheal up -d
  #
  # `restart: unless-stopped` restarts a container whose process *exited*. It
  # does nothing about a container that is up and failing its healthcheck —
  # outside Swarm, Docker records `unhealthy` and stops there — so an unhealthy
  # bot used to sit unhealthy indefinitely with nothing acting on it (#640).
  # This watches the daemon for that state and restarts the containers labelled
  # `autoheal=true`.
  #
  # It is opt-in because of what it costs: the container holds the Docker API,
  # and anything that can reach the Docker API can read every environment
  # variable of every container on the host — `docker inspect clawdia` prints
  # the bot token and each provider key in full. If you enable this, deliver the
  # secrets as files (the <NAME>_FILE form documented on the bot service above)
  # so there is nothing in the environment worth reading.
  #
  # The alternative, with no socket involved, is the external uptime monitor in
  # README's Monitoring section: it sees the same state over HTTP and pages a
  # human instead of restarting on its own.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: clawdia-autoheal
    profiles:
      - autoheal
    restart: unless-stopped
    environment:
      # Only containers carrying the label, never every unhealthy container on
      # the host — this stack is not necessarily the only thing running here.
      AUTOHEAL_CONTAINER_LABEL: autoheal
      # Long enough that a bot still inside `start_period` is never a candidate.
      AUTOHEAL_START_PERIOD: '120'
      AUTOHEAL_INTERVAL: '30'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # It talks to the daemon over the unix socket and to nothing else, so it
    # needs no network at all — including not the default bridge.
    network_mode: none

  # Scheduled backup: mongodump once a day at 03:00 UTC into ./backups, keeping
  # BACKUP_RETENTION_DAYS (30) days.
  #
  # On by default. It used to sit behind `profiles: [backup]`, which meant a
  # plain `docker compose up -d` ran the bot with no backups at all — and the
  # migration runner's own pre-migration dump is one archive at one moment, not
  # a history. Set BACKUP_RETENTION_DAYS to tune retention; to opt out entirely,
  # `docker compose up -d --scale backup=0`.
  backup:
    image: mongo:7
    container_name: clawdia-backup
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # .env normally supplies this; the default matches portainer-stack.yml so
      # a checkout without MONGODB_URI still backs up the right database
      # instead of exiting at boot.
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/ultrabot}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      # Mirrors the bot's MONGODB_URI_FILE. This is a stock mongo image with no
      # loader of its own, so the entrypoint below reads the file itself — and
      # prefers it over MONGODB_URI, so the mapping above can stay exactly as
      # it is. Uncomment this line and the `secrets:` block below together.
      # MONGODB_URI_FILE: /run/secrets/mongodb_uri
    # secrets:
    #   - mongodb_uri
    volumes:
      - ./backups:/backups
    networks:
      - db-network   # only needs to reach MongoDB
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint: >
      sh -c '
        if [ -n "$$MONGODB_URI_FILE" ]; then
          if [ ! -r "$$MONGODB_URI_FILE" ]; then
            echo "[backup] MONGODB_URI_FILE=$$MONGODB_URI_FILE is not readable"; exit 1;
          fi;
          MONGODB_URI=$$(tr -d "\r\n" < "$$MONGODB_URI_FILE");
          if [ -z "$$MONGODB_URI" ]; then
            echo "[backup] MONGODB_URI_FILE=$$MONGODB_URI_FILE is empty"; exit 1;
          fi;
          export MONGODB_URI;
          echo "[backup] Read MONGODB_URI from $$MONGODB_URI_FILE";
        fi;
        if [ -z "$$MONGODB_URI" ]; then
          echo "[backup] Neither MONGODB_URI nor MONGODB_URI_FILE is set"; exit 1;
        fi;
        RETAIN=$${BACKUP_RETENTION_DAYS:-30};
        while true; do
          # Recomputed every iteration. A fixed `sleep 86400` after the dump
          # would start each run later than the last by however long the dump
          # and the prune took, walking 03:00 into working hours over a month.
          NOW=$$(date -u +%s);
          MIDNIGHT=$$(( ($$NOW / 86400) * 86400 ));
          TARGET=$$(( $$MIDNIGHT + 10800 ));
          if [ $$NOW -ge $$TARGET ]; then TARGET=$$(( $$TARGET + 86400 )); fi;
          SLEEP=$$(( $$TARGET - $$NOW ));
          echo "[backup] Sleeping $${SLEEP}s until next 03:00 UTC";
          sleep $$SLEEP;
          TIMESTAMP=$$(date -u +"%Y%m%dT%H%M%SZ");
          echo "[backup] Starting backup at $$TIMESTAMP";
          mongodump --uri="$$MONGODB_URI" --gzip --archive="/backups/clawdia-$$TIMESTAMP.gz" &&
            echo "[backup] Done: /backups/clawdia-$$TIMESTAMP.gz" ||
            echo "[backup] FAILED";
          # Prunes the old ultrabot-* prefix too, so archives written before the
          # rename are still aged out instead of accumulating forever. The bot
          # lands pre-migration-*.gz in the same directory; those are pruned on
          # the same schedule.
          find /backups \( -name "clawdia-*.gz" -o -name "ultrabot-*.gz" -o -name "pre-migration-*.gz" \) -mtime +$$RETAIN -delete;
        done'

# Host files mounted read-only at /run/secrets/<name> inside the container.
# Keep ./secrets/ out of git (it already is, via .gitignore) and chmod 0400 the
# files. Uncomment alongside the service block above.
# Declare only the ones you actually create — compose fails the deploy for a
# declared secret whose file is missing, and a service must not list one that
# was never declared. Drop the lines for secrets you are not using.
# secrets:
#   discord_token:
#     file: ./secrets/discord_token
#   client_secret:
#     file: ./secrets/client_secret
#   session_secret:
#     file: ./secrets/session_secret
#   mongodb_uri:
#     file: ./secrets/mongodb_uri
#   secret_encryption_key:
#     file: ./secrets/secret_encryption_key
#   anthropic_api_key:
#     file: ./secrets/anthropic_api_key
#   openai_api_key:
#     file: ./secrets/openai_api_key
#   gemini_api_key:
#     file: ./secrets/gemini_api_key
#   openrouter_api_key:
#     file: ./secrets/openrouter_api_key

volumes:
  mongodb_data:

networks:
  clawdia-network:
    driver: bridge
  db-network:
    driver: bridge
    internal: true  # no external gateway — MongoDB cannot initiate outbound connections
