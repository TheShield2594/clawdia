# Deploy this file via Portainer > Stacks > Add Stack > Web Editor.
#
# BEFORE DEPLOYING:
#   1. Build and push the image to GHCR:
#        docker build -t ghcr.io/theshield2594/clawdia:latest .
#        docker push ghcr.io/theshield2594/clawdia:latest
#
#   2. If the GHCR package is private, add registry credentials in Portainer first:
#        Portainer > Registries > Add registry > Custom registry
#        URL: ghcr.io
#        Username: your GitHub username
#        Password: GitHub PAT with read:packages scope
#
#   3. Set all required variables in the Portainer Stack "Environment variables"
#      section before clicking Deploy.
#
#      SECRETS: anything set here is a plain container environment variable, and
#      those are readable by anyone who can reach the Docker API — `docker
#      inspect clawdia` prints them in full, and Portainer shows the same values
#      in the container detail view. To keep the bot token, the OAuth client
#      secret, the session secret and the provider keys out of both, deliver
#      them as files instead: every one of those variables also accepts a
#      <NAME>_FILE form naming a file to read the value from (see
#      src/config/fileSecrets.js). The `secrets:` block at the bottom of this
#      file wires that up; uncomment it and the matching lines in the service to
#      switch over. Create the secrets first, in Portainer > Secrets (Swarm) or
#      by mounting host files, and leave the plain variable unset — if both are
#      set the plain one wins and the file is ignored. MONGODB_URI is the one
#      that needs its mapping deleted rather than merely left blank, because it
#      has a default; see the note beside it below.
#
#      DASHBOARD_URL has no default on purpose. With NODE_ENV=production the bot
#      refuses to start unless it is an https:// URL (see resolveDashboardUrl in
#      src/dashboard/server.js), so a placeholder default would only produce a
#      crash-loop on first deploy. Set it to the public HTTPS address of your
#      reverse proxy, and register that exact URL + "/auth/callback" under
#      OAuth2 > Redirects in the Discord Developer Portal.

services:
  mongodb:
    image: mongo:7
    container_name: clawdia-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - db-network   # internal-only: no external routing, no published ports
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # Unbounded, mongod sizes its WiredTiger cache from *host* RAM — half of
    # (host RAM - 1g) — so on a big host it will happily grow past anything the
    # bot leaves it and take the machine down with it. mongod reads the cgroup
    # limit, so this ceiling is also what tells it to cap the cache at the 256m
    # floor. Raise both together if the working set outgrows it.
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g

  bot:
    image: ghcr.io/theshield2594/clawdia:latest
    container_name: clawdia
    restart: unless-stopped
    environment:
      # --- Required ---
      # Every secret below is also readable as <NAME>_FILE; see the note at the
      # top of this file and the commented block after this service.
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - CLIENT_ID=${CLIENT_ID}
      - CLIENT_SECRET=${CLIENT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - DASHBOARD_URL=${DASHBOARD_URL}
      # --- Optional: AI providers ---
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      # Path to the MCP server list (Anthropic provider only). Needs the
      # volume below; leave unset to keep the MCP connector off.
      - MCP_SERVERS_CONFIG=${MCP_SERVERS_CONFIG:-}
      # --- Optional: meme generation (/meme) ---
      - IMGFLIP_USERNAME=${IMGFLIP_USERNAME}
      - IMGFLIP_PASSWORD=${IMGFLIP_PASSWORD}
      # --- Defaults (override if needed) ---
      # The database name is still "ultrabot" after the rebrand, on purpose:
      # renaming it does not move data, it just points the bot at an empty
      # database. Change it only alongside a dump-and-restore into the new name.
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/ultrabot}
      - DASHBOARD_PORT=7001
      - AUDIT_LOG_RETENTION_DAYS=${AUDIT_LOG_RETENTION_DAYS:-90}
      - NODE_ENV=${NODE_ENV:-production}
      #
      # --- Secrets as files (recommended) ---------------------------------
      # Uncomment these *and* the matching `secrets:` entries below, then leave
      # the plain DISCORD_TOKEN / CLIENT_SECRET / SESSION_SECRET / *_API_KEY
      # variables above unset. The container environment then holds only the
      # paths, which `docker inspect` and the Portainer UI are welcome to show.
      # - DISCORD_TOKEN_FILE=/run/secrets/discord_token
      # - CLIENT_SECRET_FILE=/run/secrets/client_secret
      # - SESSION_SECRET_FILE=/run/secrets/session_secret
      # MONGODB_URI needs one extra step: unlike the others, its mapping above
      # carries a `:-` default, so it is never empty and always wins over the
      # file. DELETE the `- MONGODB_URI=...` line above before uncommenting
      # this, or the secret is read and then ignored with a warning.
      # - MONGODB_URI_FILE=/run/secrets/mongodb_uri
      # - OPENAI_API_KEY_FILE=/run/secrets/openai_api_key
      # - GEMINI_API_KEY_FILE=/run/secrets/gemini_api_key
      # - ANTHROPIC_API_KEY_FILE=/run/secrets/anthropic_api_key
      # - OPENROUTER_API_KEY_FILE=/run/secrets/openrouter_api_key
    # The secrets this service should have mounted under /run/secrets. Only the
    # ones you actually use — a declared-but-missing secret fails the deploy, so
    # delete the lines for anything you are not mounting.
    # secrets:
    #   - discord_token
    #   - client_secret
    #   - session_secret
    #   - mongodb_uri
    #   - openai_api_key
    #   - gemini_api_key
    #   - anthropic_api_key
    #   - openrouter_api_key
    # A Portainer stack has no repo checkout to mount, so put mcp-servers.json
    # somewhere on the Docker host and point MCP_SERVERS_CONFIG at it inside the
    # container. Mounted read-only: the file can hold OAuth tokens.
    # volumes:
    #   - /opt/clawdia/config:/app/config:ro
    # Loopback only — put your reverse proxy in front of this. Publish on
    # 0.0.0.0 only if TLS is terminated elsewhere on the host network.
    ports:
      - "127.0.0.1:7001:7001"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - db-network       # reaches MongoDB
      - clawdia-network # reaches the internet (Discord API, AI APIs, etc.)
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    # Hit /health, not /. The root route returns 200 even when MongoDB is down,
    # so it would report a bot that cannot read or write anything as healthy.
    #
    # The probe reads `status` out of the JSON body rather than looking at the
    # HTTP code, and fails only on `unhealthy` — MongoDB down, which is the one
    # state a restart is worth trying on.
    #
    # `degraded` (mongo up, a scheduled service failing every run) answers 503
    # but is deliberately *not* a healthcheck failure: restarting the process
    # does not fix a feed that is 404ing, and the restart loop would be worse
    # than the degraded state. It is a page-a-human signal, which is what the
    # uptime monitor described in README's Monitoring section is for.
    healthcheck:
      test: ["CMD", "node", "-e",
        "require('http').get('http://localhost:7001/health', (r) => { let b=''; r.on('data', d => b+=d); r.on('end', () => { try { const s = JSON.parse(b).status; process.exit(s === 'unhealthy' ? 1 : 0); } catch { process.exit(1); } }); }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    # Compose v2 applies `limits` to the container's cgroup on a plain
    # `docker compose up`. `reservations` is a scheduling hint that only Swarm
    # acts on: it is kept as a record of the intended floor, not as something
    # the daemon enforces here.
    deploy:
      resources:
        limits:
          # Canvas rendering (shop banners, profile cards, the 8ball image) is
          # synchronous and single-threaded, so a burst of those commands pegs a
          # core for as long as it takes. With no ceiling that contends with
          # mongod and anything else sharing the host; two cores lets a render
          # run flat out while the event loop keeps answering on the other.
          cpus: '2.0'
          memory: 1g
        reservations:
          memory: 256m
    stop_grace_period: 30s
    labels:
      # Read by the optional `autoheal` service below. Harmless while that
      # service does not exist, which is why it is not commented out: enabling
      # autoheal is then one block to uncomment, with nothing to remember here.
      autoheal: "true"

  # Optional container-level self-healing. Uncomment the whole block to enable.
  #
  # `restart: unless-stopped` restarts a container whose process *exited*. It
  # does nothing about a container that is up and failing its healthcheck —
  # outside Swarm, Docker records `unhealthy` and stops there — so an unhealthy
  # bot sits unhealthy indefinitely with nothing acting on it (#640). This
  # watches the daemon for that state and restarts containers labelled
  # `autoheal=true`.
  #
  # It ships commented out because of what it costs: the container holds the
  # Docker API, and anything that can reach the Docker API can read every
  # environment variable of every container on the host — the same exposure the
  # note at the top of this file describes, now granted to a container rather
  # than to whoever has a Portainer login. If you enable this, move the bot
  # token, the OAuth client secret, the session secret and the provider keys to
  # the <NAME>_FILE form first, so there is nothing in the environment to read.
  #
  # The alternative, with no socket involved, is the external uptime monitor in
  # README's Monitoring section: it sees the same state over HTTP and pages a
  # human instead of restarting on its own.
  # autoheal:
  #   image: willfarrell/autoheal:1.2.0
  #   container_name: clawdia-autoheal
  #   restart: unless-stopped
  #   environment:
  #     # Only containers carrying the label, never every unhealthy container on
  #     # the host — this stack is not necessarily the only thing running here.
  #     - AUTOHEAL_CONTAINER_LABEL=autoheal
  #     # Long enough that a bot still inside `start_period` is never a candidate.
  #     - AUTOHEAL_START_PERIOD=120
  #     - AUTOHEAL_INTERVAL=30
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   # It talks to the daemon over the unix socket and to nothing else, so it
  #   # needs no network at all — including not the default bridge.
  #   network_mode: none

# Declare each secret once here, then list it under the service that needs it.
# `external: true` means Portainer > Secrets (Swarm) already holds the value;
# on a plain non-Swarm Docker host use the `file:` form instead, pointing at a
# root-owned, 0400 file on the host.
# secrets:
#   discord_token:
#     external: true
#     # file: /opt/clawdia/secrets/discord_token
#   client_secret:
#     external: true
#   session_secret:
#     external: true
#   mongodb_uri:
#     external: true
#   openai_api_key:
#     external: true
#   gemini_api_key:
#     external: true
#   anthropic_api_key:
#     external: true
#   openrouter_api_key:
#     external: true

volumes:
  mongodb_data:

networks:
  clawdia-network:
    driver: bridge
  db-network:
    driver: bridge
    internal: true  # no external gateway — MongoDB cannot initiate outbound connections
