# Deploy this file via Portainer > Stacks > Add Stack > Web Editor.
#
# BEFORE DEPLOYING:
#   1. Build and push the image to GHCR:
#        docker build -t ghcr.io/theshield2594/clawdia:latest .
#        docker push ghcr.io/theshield2594/clawdia:latest
#
#   2. If the GHCR package is private, add registry credentials in Portainer first:
#        Portainer > Registries > Add registry > Custom registry
#        URL: ghcr.io
#        Username: your GitHub username
#        Password: GitHub PAT with read:packages scope
#
#   3. Set all required variables in the Portainer Stack "Environment variables"
#      section before clicking Deploy.
#
#      SECRETS: anything set here is a plain container environment variable, and
#      those are readable by anyone who can reach the Docker API — `docker
#      inspect clawdia` prints them in full, and Portainer shows the same values
#      in the container detail view. To keep the bot token, the OAuth client
#      secret, the session secret and the provider keys out of both, deliver
#      them as files instead: every one of those variables also accepts a
#      <NAME>_FILE form naming a file to read the value from (see
#      src/config/fileSecrets.js). The `secrets:` block at the bottom of this
#      file wires that up; uncomment it and the matching lines in the service to
#      switch over. Create the secrets first, in Portainer > Secrets (Swarm) or
#      by mounting host files, and leave the plain variable unset — if both are
#      set the plain one wins and the file is ignored. MONGODB_URI is the one
#      that needs its mapping deleted rather than merely left blank, because it
#      has a default; see the note beside it below.
#
#      DASHBOARD_URL has no default on purpose. With NODE_ENV=production the bot
#      refuses to start unless it is an https:// URL (see resolveDashboardUrl in
#      src/dashboard/server.js), so a placeholder default would only produce a
#      crash-loop on first deploy. Set it to the public HTTPS address of your
#      reverse proxy, and register that exact URL + "/auth/callback" under
#      OAuth2 > Redirects in the Discord Developer Portal.

services:
  mongodb:
    # Digest-pinned so the same stack file always deploys the same mongod (#644);
    # `mongo:7` alone is re-published on every 7.x patch. Bumped by Dependabot,
    # held by tests/imagePinning.test.js. The tag stays for readability — Docker
    # resolves the digest.
    image: mongo:7@sha256:b6421fd6d1c5ded6377b397d8983e2f82e2100dc5123332dcfda2065a472be5b
    container_name: clawdia-mongodb
    restart: unless-stopped
    # Authentication (#648). The internal-only network keeps the outside world
    # away from mongod, but on its own it is the *only* control: any container
    # that joins db-network gets full, credential-less database access. Set
    # MONGODB_ROOT_USERNAME + MONGODB_ROOT_PASSWORD in the stack's environment
    # variables and the mongo image creates the root user and starts mongod
    # with --auth. Then point MONGODB_URI at credentials — with the dedicated
    # app user below:
    #
    #   MONGODB_URI=mongodb://appuser:apppass@mongodb:27017/ultrabot?authSource=ultrabot
    #
    # (No need to touch the `:-` default on the bot's MONGODB_URI mapping for
    # this — setting MONGODB_URI in the stack environment overrides it. Only
    # the *_FILE form needs that mapping deleted, per the note at the top.)
    #
    # MONGODB_APP_USERNAME + MONGODB_APP_PASSWORD feed the init script that
    # creates that low-privilege user (readWrite on ultrabot, nothing else) —
    # but a Portainer stack has no repo checkout to mount it from, so copy
    # scripts/mongo-init.js from the repo to the Docker host and uncomment the
    # mount below. Without the script, MONGO_INITDB_ROOT_* still works: auth is
    # on and MONGODB_URI can carry the root credentials with authSource=admin,
    # which is still better than no auth, just not least-privilege.
    #
    # All of this takes effect ONLY on the first start against an empty
    # mongodb_data volume; the image skips initialization when data exists. To
    # enable auth on a deployment that already has data, see "Enabling MongoDB
    # authentication" in docs/SETUP_GUIDE.md — a few mongosh commands, not a wipe.
    # Left unset, everything behaves exactly as before (no auth), so existing
    # deployments keep starting; new ones should set all four.
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME:-}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:-}
      MONGODB_APP_USERNAME: ${MONGODB_APP_USERNAME:-}
      MONGODB_APP_PASSWORD: ${MONGODB_APP_PASSWORD:-}
    # Extra mongod flags, empty by default so nothing changes for a deployment
    # that does not set it (#891). What it is for is running mongod as a
    # single-node replica set, which is what makes MongoDB's multi-document
    # transactions available:
    #
    #   MONGODB_REPLICA_SET_ARGS=--replSet rs0
    #
    # With authentication also on, MongoDB requires internal authentication for a
    # replica set and mongod refuses to start without a key file, so both flags
    # belong in the same variable — and the file has to be mounted below:
    #
    #   MONGODB_REPLICA_SET_ARGS=--replSet rs0 --keyFile /etc/mongo-keyfile
    #
    # `mongo-replset-init` does the one-time `rs.initiate()`. See "Running
    # MongoDB as a single-node replica set" in docs/SETUP_GUIDE.md for the full
    # procedure, including the one for a deployment that already has data.
    command: mongod ${MONGODB_REPLICA_SET_ARGS:-}
    volumes:
      - mongodb_data:/data/db
      # - /opt/clawdia/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      # - /opt/clawdia/mongo-keyfile:/etc/mongo-keyfile:ro
    networks:
      - db-network   # internal-only: no external routing, no published ports
    healthcheck:
      # "Will you accept a write", not "are you listening". `hello` is answered
      # without authentication, exactly as `ping` was, so this still works with
      # auth enabled — but unlike `ping` it is false for a replica-set member
      # that has not been initiated yet (#891), which is precisely the state in
      # which the bot must not be started: its migrations run at boot and would
      # fail against a node that is not primary. A standalone mongod reports
      # itself writable as soon as it is up, so nothing changes there.
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.hello().isWritablePrimary ? 0 : 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Covers the replica-set initiation as well as the boot, since that is
      # what stands between mongod starting and mongod being writable.
      start_period: 90s
    # Unbounded, mongod sizes its WiredTiger cache from *host* RAM — half of
    # (host RAM - 1g) — so on a big host it will happily grow past anything the
    # bot leaves it and take the machine down with it. mongod reads the cgroup
    # limit, so this ceiling is also what tells it to cap the cache at the 256m
    # floor. Raise both together if the working set outgrows it.
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g

  # Initiates the single-node replica set, once, if there is one (#891).
  #
  # Standalone, MongoDB has no multi-document transactions, so every cross-user
  # and cross-collection money move — rob, market, syndicate payouts, bank
  # transfer — hand-rolls its own compensation instead: retry, then the
  # owed-payout ledger (src/utils/owedPayout.js), then an operator running
  # `npm run payouts:replay`. That machinery stays either way, because it also
  # covers Discord-side delivery failures, which a transaction cannot. What it
  # cannot be is the only answer: it is opt-in per code path, and a new money
  # path that does not reimplement it loses coins silently. A replica set of one
  # node is the whole of what stands between this deployment and a real
  # transaction being available to the paths that want one.
  #
  # This container does nothing at all unless mongod was started with --replSet,
  # so it is harmless on a standalone deployment:
  #
  #   1. Wait for mongod to answer `hello`, which needs no authentication.
  #   2. If it reports itself writable, there is nothing to do — that covers a
  #      standalone and an already-initiated set alike, and is why an existing
  #      deployment gains no new failure and no new credential requirement.
  #   3. Otherwise the node is a replica-set member with no config, so read the
  #      set name mongod was actually started with and initiate it. Reading that
  #      name is the one step that needs MONGODB_ROOT_USERNAME /
  #      MONGODB_ROOT_PASSWORD, and only when authentication is on.
  #
  # Reading the name off mongod rather than taking it as a second variable is
  # deliberate: two variables that have to agree is a way for them to disagree,
  # and the set this initiates would then not be the set mongod is running.
  #
  # `restart: "no"`. A failure here leaves mongod un-writable, so its healthcheck
  # stays red and nothing that depends on it starts — the reason is in this
  # container's log rather than buried in a restart loop.
  mongo-replset-init:
    image: mongo:7@sha256:b6421fd6d1c5ded6377b397d8983e2f82e2100dc5123332dcfda2065a472be5b
    container_name: clawdia-mongo-replset-init
    restart: "no"
    depends_on:
      # Deliberately not service_healthy. mongod's healthcheck now asks "will you
      # accept a write", which for a replica set is only true *after* this has
      # run, so waiting for it would deadlock.
      - mongodb
    networks:
      - db-network
    environment:
      MONGODB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME:-}
      MONGODB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:-}
    # No apostrophes below — not in a comment either (#940). Compose splits a
    # string entrypoint into arguments before the container starts, so the first
    # single quote inside this script closes the one that opened it and
    # everything after becomes positional arguments that never run. That is not
    # a warning in the abstract: "the day's backup", in a comment two thirds of
    # the way down the backup entrypoint, had been truncating it mid-`if` in
    # both stack files. Reword; there is no escape for one in this form.
    # tests/stackEntrypointShell.test.js fails on the next one.
    entrypoint: >
      sh -c '
        # The host:port the members list will carry, which is how every client
        # reaches this node once it has discovered the set: the service name on
        # db-network, the same one MONGODB_URI defaults to — not localhost, or
        # the bot would be told to connect to itself.
        HOST=mongodb:27017;
        # A function rather than an AUTH string spliced into each command line:
        # unquoted, a password containing a space would be split into separate
        # arguments and mongosh would get a truncated one; quoted, it would be a
        # single empty argument when auth is off. Passing the credentials as
        # their own quoted arguments is the only form that is right both ways.
        authed_mongosh() {
          if [ -n "$$MONGODB_ROOT_USERNAME" ]; then
            mongosh --host "$$HOST" --quiet --username "$$MONGODB_ROOT_USERNAME" --password "$$MONGODB_ROOT_PASSWORD" --authenticationDatabase admin "$$@";
          else
            mongosh --host "$$HOST" --quiet "$$@";
          fi;
        };
        # Unauthenticated on purpose: `hello` is answered before login, which is
        # what lets this work on a deployment whose credentials it was not given.
        writable() {
          mongosh --host "$$HOST" --quiet --eval "quit(db.hello().isWritablePrimary ? 0 : 1)" >/dev/null 2>&1;
        };
        # mongod accepts a TCP connection well before it answers anything, so
        # this waits on an answer and not on the port being open.
        i=0;
        until mongosh --host "$$HOST" --quiet --eval "db.hello()" >/dev/null 2>&1; do
          i=$$((i + 1));
          if [ $$i -ge 60 ]; then echo "[replset-init] mongod at $$HOST never answered"; exit 1; fi;
          sleep 2;
        done;
        if writable; then
          echo "[replset-init] $$HOST already accepts writes; nothing to do";
          exit 0;
        fi;
        NAME=$$(authed_mongosh --eval "(db.adminCommand({ getCmdLineOpts: 1 }).parsed.replication || {}).replSetName || \"\"" 2>/dev/null) || NAME="";
        if [ -z "$$NAME" ]; then
          echo "[replset-init] $$HOST does not accept writes and its replica set name could not be read.";
          echo "[replset-init] With authentication on, this service needs MONGODB_ROOT_USERNAME and MONGODB_ROOT_PASSWORD.";
          exit 1;
        fi;
        echo "[replset-init] Initiating replica set $$NAME with member $$HOST";
        # AlreadyInitialized is not a failure: a redeploy against a set that is
        # already configured, by this or by hand, lands here every time.
        authed_mongosh --eval "
          try { rs.initiate({ _id: \"$$NAME\", members: [{ _id: 0, host: \"$$HOST\" }] }); }
          catch (e) { if (e.codeName !== \"AlreadyInitialized\") { throw e; } }
        " || exit 1;
        # Initiating is not the same as having elected itself. Everything that
        # depends on mongod already waits on its healthcheck, which asks the same
        # question — this is here so the log says which of the two happened.
        i=0;
        until writable; do
          i=$$((i + 1));
          if [ $$i -ge 60 ]; then echo "[replset-init] $$NAME did not become primary"; exit 1; fi;
          sleep 1;
        done;
        echo "[replset-init] $$NAME is primary";
      '

  bot:
    # Not a bare `:latest` (#637). `latest` moves with every push to main, so it
    # cannot name the build that was running before a bad deploy — pulling it
    # again just fetches the same broken image. CI publishes an immutable
    # sha-<full commit> tag for every build, so pin this to one and bump it
    # deliberately:
    #
    #     CLAWDIA_IMAGE_TAG=sha-<40-char commit sha>
    #
    # in the stack's environment (Portainer > Stacks > Environment variables, or
    # the .env beside this file). To roll back, set it to the previous deploy's
    # sha and redeploy. Unset it and you are back on `latest` — which is fine
    # for a first deploy and is why that is still the default, but leaves you
    # with no rollback target the next time.
    #
    # The schema does not roll back with the image: migrations here are
    # forward-only and destructive, so an image rollback across a migration
    # boundary also needs the pre-migration dump from /app/backups.
    image: ghcr.io/theshield2594/clawdia:${CLAWDIA_IMAGE_TAG:-latest}
    container_name: clawdia
    restart: unless-stopped
    environment:
      # --- Required ---
      # Every secret below is also readable as <NAME>_FILE; see the note at the
      # top of this file and the commented block after this service.
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - CLIENT_ID=${CLIENT_ID}
      - CLIENT_SECRET=${CLIENT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - DASHBOARD_URL=${DASHBOARD_URL}
      # --- Optional: AI providers ---
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      # Encrypts the per-server AI provider keys admins enter in the dashboard,
      # so the nightly dumps in the backups volume hold ciphertext rather than
      # live credentials (#564). Generate with `openssl rand -base64 32`, and
      # keep it — the stored keys cannot be read back without it.
      - SECRET_ENCRYPTION_KEY=${SECRET_ENCRYPTION_KEY}
      # Path to the MCP server list (Anthropic provider only). Needs the
      # volume below; leave unset to keep the MCP connector off.
      - MCP_SERVERS_CONFIG=${MCP_SERVERS_CONFIG:-}
      # --- Optional: meme generation (/meme) ---
      - IMGFLIP_USERNAME=${IMGFLIP_USERNAME}
      - IMGFLIP_PASSWORD=${IMGFLIP_PASSWORD}
      # --- Defaults (override if needed) ---
      # The database name is still "ultrabot" after the rebrand, on purpose:
      # renaming it does not move data, it just points the bot at an empty
      # database. Change it only alongside a dump-and-restore into the new name.
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/ultrabot}
      # The port *inside* the container, which is also what the image
      # EXPOSEs and what its own HEALTHCHECK probes. The host-side port is
      # the `ports:` mapping below and is a separate choice.
      - DASHBOARD_PORT=${DASHBOARD_PORT:-3000}
      - AUDIT_LOG_RETENTION_DAYS=${AUDIT_LOG_RETENTION_DAYS:-90}
      - NODE_ENV=${NODE_ENV:-production}
      # An irreversible migration is forward-only, so the mongodump the runner
      # takes immediately before one is the only way back from it — which is
      # what the `backups` volume below is for, and what the note on it says it
      # is for. Unset, that dump is best-effort: a failure is a warning in the
      # log and the destructive step runs anyway, which leaves this stack
      # promising a recovery path it did not take. `require` makes a failed or
      # impossible backup abort the boot instead. Override to `skip` only if
      # you are taking the dump yourself.
      - MIGRATION_BACKUP=${MIGRATION_BACKUP:-require}
      #
      # --- Secrets as files (recommended) ---------------------------------
      # Uncomment these *and* the matching `secrets:` entries below, then leave
      # the plain DISCORD_TOKEN / CLIENT_SECRET / SESSION_SECRET / *_API_KEY
      # variables above unset. The container environment then holds only the
      # paths, which `docker inspect` and the Portainer UI are welcome to show.
      # - DISCORD_TOKEN_FILE=/run/secrets/discord_token
      # - CLIENT_SECRET_FILE=/run/secrets/client_secret
      # - SESSION_SECRET_FILE=/run/secrets/session_secret
      # MONGODB_URI needs one extra step: unlike the others, its mapping above
      # carries a `:-` default, so it is never empty and always wins over the
      # file. DELETE the `- MONGODB_URI=...` line above before uncommenting
      # this, or the secret is read and then ignored with a warning.
      # - MONGODB_URI_FILE=/run/secrets/mongodb_uri
      # - SECRET_ENCRYPTION_KEY_FILE=/run/secrets/secret_encryption_key
      # - OPENAI_API_KEY_FILE=/run/secrets/openai_api_key
      # - GEMINI_API_KEY_FILE=/run/secrets/gemini_api_key
      # - ANTHROPIC_API_KEY_FILE=/run/secrets/anthropic_api_key
      # - OPENROUTER_API_KEY_FILE=/run/secrets/openrouter_api_key
    # The secrets this service should have mounted under /run/secrets. Only the
    # ones you actually use — a declared-but-missing secret fails the deploy, so
    # delete the lines for anything you are not mounting.
    # secrets:
    #   - discord_token
    #   - client_secret
    #   - session_secret
    #   - mongodb_uri
    #   - secret_encryption_key
    #   - openai_api_key
    #   - gemini_api_key
    #   - anthropic_api_key
    #   - openrouter_api_key
    volumes:
      # src/migrations/runner.js dumps the database here before it applies an
      # irreversible migration. Without a volume that dump lands in the
      # container's writable layer and the next image pull destroys it — which
      # is precisely the copy you would want after a bad migration.
      - backups:/app/backups
      # A Portainer stack has no repo checkout to mount, so put mcp-servers.json
      # somewhere on the Docker host and point MCP_SERVERS_CONFIG at it inside
      # the container. Mounted read-only: the file can hold OAuth tokens.
      # - /opt/clawdia/config:/app/config:ro
    # Loopback only — put your reverse proxy in front of this. Publish on
    # 0.0.0.0 only if TLS is terminated elsewhere on the host network.
    #
    # Host port 7001 by default, container port 3000. Point the reverse proxy at
    # DASHBOARD_HOST_PORT; DASHBOARD_PORT above is the container's side and
    # should normally stay 3000 so the image's EXPOSE and HEALTHCHECK match it.
    ports:
      - "127.0.0.1:${DASHBOARD_HOST_PORT:-7001}:${DASHBOARD_PORT:-3000}"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - db-network       # reaches MongoDB
      - clawdia-network # reaches the internet (Discord API, AI APIs, etc.)
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    # Hit /health, not /. The root route returns 200 even when MongoDB is down,
    # so it would report a bot that cannot read or write anything as healthy.
    #
    # The probe reads `status` out of the JSON body rather than looking at the
    # HTTP code, and fails only on `unhealthy` — MongoDB down, which is the one
    # state a restart is worth trying on.
    #
    # `degraded` (mongo up, a scheduled service failing every run) answers 503
    # but is deliberately *not* a healthcheck failure: restarting the process
    # does not fix a feed that is 404ing, and the restart loop would be worse
    # than the degraded state. It is a page-a-human signal, which is what the
    # uptime monitor described in README's Monitoring section is for.
    healthcheck:
      test: ["CMD", "node", "-e",
        "require('http').get('http://127.0.0.1:' + (process.env.DASHBOARD_PORT || 3000) + '/health', (r) => { let b=''; r.on('data', d => b+=d); r.on('end', () => { try { const s = JSON.parse(b).status; process.exit(s === 'unhealthy' ? 1 : 0); } catch { process.exit(1); } }); }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    # Compose v2 applies `limits` to the container's cgroup on a plain
    # `docker compose up`. `reservations` is a scheduling hint that only Swarm
    # acts on: it is kept as a record of the intended floor, not as something
    # the daemon enforces here.
    deploy:
      resources:
        limits:
          # Canvas rendering (shop banners, profile cards, the 8ball image) is
          # synchronous and single-threaded, so a burst of those commands pegs a
          # core for as long as it takes. With no ceiling that contends with
          # mongod and anything else sharing the host; two cores lets a render
          # run flat out while the event loop keeps answering on the other.
          cpus: '2.0'
          memory: 1g
        reservations:
          memory: 256m
    stop_grace_period: 30s
    labels:
      # Read by the optional `autoheal` service below. Harmless while that
      # service does not exist, which is why it is not commented out: enabling
      # autoheal is then one block to uncomment, with nothing to remember here.
      autoheal: "true"

  # Scheduled backup: mongodump once a day at 03:00 UTC into the `backups`
  # volume, keeping 30 days.
  #
  # Not optional and not behind a profile. This is the production deploy and
  # migrations here are destructive and forward-only — src/migrations/runner.js
  # dumps before an irreversible step, but that is one archive taken at one
  # moment, not a backup history. Delete this service only if something outside
  # the stack (a host cron running scripts/backup.sh, a volume snapshot) is
  # demonstrably taking its place.
  #
  # Archives land in the `backups` named volume, which the bot also mounts at
  # /app/backups. To copy one to the host:
  #   docker run --rm -v clawdia_backups:/b -v "$PWD:/out" alpine \
  #     sh -c 'cp /b/clawdia-<timestamp>.gz /out/'
  # To restore one, see scripts/restore.sh and scripts/verify-backup.sh.
  backup:
    image: mongo:7@sha256:b6421fd6d1c5ded6377b397d8983e2f82e2100dc5123332dcfda2065a472be5b
    container_name: clawdia-backup
    restart: unless-stopped
    environment:
      # Same default as the bot, so a stack that never sets MONGODB_URI still
      # backs up the database the bot is actually writing to.
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/ultrabot}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
      # Where the entrypoint sends a failed dump or an archive that will not
      # parse back (#899). Unset — the default — it logs and nothing else.
      - ERROR_WEBHOOK_URL=${ERROR_WEBHOOK_URL:-}
      # Seals each archive with AES-256-CBC (#886). `mongodump --gzip` is
      # compression, so unset every archive in the volume is a readable copy of
      # the whole database and a month of them is kept. This container is the
      # only thing that writes them, so it is the only thing that can seal them.
      - BACKUP_ENCRYPTION_PASSPHRASE=${BACKUP_ENCRYPTION_PASSPHRASE:-}
      # Delivered as a file instead, the same way MONGODB_URI can be. Uncomment
      # with the matching `secrets:` entry below.
      # - BACKUP_ENCRYPTION_PASSPHRASE_FILE=/run/secrets/backup_encryption_passphrase
      # Mirrors the bot's MONGODB_URI_FILE. This is a stock mongo image with no
      # loader of its own, so the entrypoint below reads the file itself — and
      # prefers it over MONGODB_URI, so unlike the bot's mapping the
      # `- MONGODB_URI=` line above can stay exactly as it is.
      # - MONGODB_URI_FILE=/run/secrets/mongodb_uri
    # secrets:
    #   - mongodb_uri
    #   - backup_encryption_passphrase
    volumes:
      - backups:/backups
    networks:
      - db-network   # only needs to reach MongoDB
    depends_on:
      mongodb:
        condition: service_healthy
    # No apostrophes below — not in a comment either (#940). Compose splits a
    # string entrypoint into arguments before the container starts, so the first
    # single quote inside this script closes the one that opened it and
    # everything after becomes positional arguments that never run. That is not
    # a warning in the abstract: "the day's backup", in a comment two thirds of
    # the way down the backup entrypoint, had been truncating it mid-`if` in
    # both stack files. Reword; there is no escape for one in this form.
    # tests/stackEntrypointShell.test.js fails on the next one.
    entrypoint: >
      sh -c '
        if [ -n "$$MONGODB_URI_FILE" ]; then
          if [ ! -r "$$MONGODB_URI_FILE" ]; then
            echo "[backup] MONGODB_URI_FILE=$$MONGODB_URI_FILE is not readable"; exit 1;
          fi;
          MONGODB_URI=$$(tr -d "\r\n" < "$$MONGODB_URI_FILE");
          if [ -z "$$MONGODB_URI" ]; then
            echo "[backup] MONGODB_URI_FILE=$$MONGODB_URI_FILE is empty"; exit 1;
          fi;
          export MONGODB_URI;
          echo "[backup] Read MONGODB_URI from $$MONGODB_URI_FILE";
        fi;
        if [ -z "$$MONGODB_URI" ]; then
          echo "[backup] Neither MONGODB_URI nor MONGODB_URI_FILE is set"; exit 1;
        fi;
        RETAIN=$${BACKUP_RETENTION_DAYS:-30};
        # The passphrase the archives are sealed with (#886). `mongodump --gzip`
        # is compression: unset, every archive here is a readable copy of the
        # whole database and a month of them is kept, which is the exposure
        # SECRET_ENCRYPTION_KEY only covers the credentials of.
        #
        # Read from a file first, the same way MONGODB_URI is, so it can be
        # delivered as a docker secret rather than as a container variable.
        if [ -n "$$BACKUP_ENCRYPTION_PASSPHRASE_FILE" ]; then
          if [ ! -r "$$BACKUP_ENCRYPTION_PASSPHRASE_FILE" ]; then
            echo "[backup] BACKUP_ENCRYPTION_PASSPHRASE_FILE=$$BACKUP_ENCRYPTION_PASSPHRASE_FILE is not readable"; exit 1;
          fi;
          BACKUP_ENCRYPTION_PASSPHRASE=$$(tr -d "\r\n" < "$$BACKUP_ENCRYPTION_PASSPHRASE_FILE");
          if [ -z "$$BACKUP_ENCRYPTION_PASSPHRASE" ]; then
            echo "[backup] BACKUP_ENCRYPTION_PASSPHRASE_FILE=$$BACKUP_ENCRYPTION_PASSPHRASE_FILE is empty"; exit 1;
          fi;
          export BACKUP_ENCRYPTION_PASSPHRASE;
          echo "[backup] Read BACKUP_ENCRYPTION_PASSPHRASE from $$BACKUP_ENCRYPTION_PASSPHRASE_FILE";
        fi;
        if [ -n "$$BACKUP_ENCRYPTION_PASSPHRASE" ]; then
          # Refused rather than downgraded. An operator who asked for encrypted
          # archives and silently got readable ones is worse off than one who
          # never asked, because they stop thinking about the directory.
          if ! command -v openssl >/dev/null 2>&1; then
            echo "[backup] BACKUP_ENCRYPTION_PASSPHRASE is set but openssl is not in this image; refusing to write archives in the clear"; exit 1;
          fi;
          echo "[backup] Archives are encrypted (AES-256-CBC, PBKDF2)";
        else
          echo "[backup] BACKUP_ENCRYPTION_PASSPHRASE is not set; archives are written unencrypted";
        fi;
        # Two files the loop keeps in the backup volume, both of them for
        # something outside the container to read (#899). STATUS is for a human
        # asking "what happened last night"; OK_MARKER carries no content at all
        # and exists only so the healthcheck below has an mtime to compare
        # against. They are separate because the healthcheck must not go green
        # for a run that failed, and a single file would have to be parsed to
        # tell those apart.
        STATUS=/backups/.backup-status;
        OK_MARKER=/backups/.backup-ok;
        # A failure that only reaches the log reaches nobody: this container is
        # not the one anybody tails. ERROR_WEBHOOK_URL is the sink the bot
        # already reports crashes to (src/utils/errorReporter.js), and a Discord
        # webhook gets Discord shape for the same reason it does there — that is
        # the sink the operator of a Discord bot already has.
        # The same rule src/utils/errorReporter.js applies to the same variable:
        # https anywhere, http only to loopback, everything else refused rather
        # than downgraded. The report names a database host and an archive path,
        # and over cleartext to a third party that is readable on the wire; a
        # sink that is refused there must not be honoured here.
        sink_allowed() {
          case "$$1" in
            https://*) return 0;;
            http://localhost|http://localhost/*|http://localhost:*) return 0;;
            http://127.0.0.1|http://127.0.0.1/*|http://127.0.0.1:*) return 0;;
            "http://[::1]"|"http://[::1]/"*|"http://[::1]:"*) return 0;;
            *) return 1;;
          esac;
        };
        notify() {
          echo "[backup] $$1";
          if [ -z "$$ERROR_WEBHOOK_URL" ]; then return 0; fi;
          if ! sink_allowed "$$ERROR_WEBHOOK_URL"; then
            echo "[backup] Ignoring ERROR_WEBHOOK_URL: expected an https:// URL (or http:// to loopback)"; return 0;
          fi;
          if ! command -v curl >/dev/null 2>&1; then
            echo "[backup] curl is not present in this image; ERROR_WEBHOOK_URL not posted"; return 0;
          fi;
          case "$$ERROR_WEBHOOK_URL" in
            https://discord.com/api/webhooks/*|https://discordapp.com/api/webhooks/*)
              BODY="{\"content\":\"**backup failed** on clawdia-backup: $$1\"}";;
            *)
              BODY="{\"kind\":\"backup_failed\",\"service\":\"clawdia-backup\",\"message\":\"$$1\"}";;
          esac;
          # Never fatal, and never blocking for long: the next run matters more
          # than this post landing.
          curl -fsS --max-time 10 -X POST -H "content-type: application/json" -d "$$BODY" "$$ERROR_WEBHOOK_URL" >/dev/null 2>&1 ||
            echo "[backup] posting to ERROR_WEBHOOK_URL failed";
        };
        prune() {
          # Prunes the old ultrabot-* prefix too, so archives written before the
          # rename are still aged out instead of accumulating forever. The bot
          # lands pre-migration-*.gz in the same volume; those are pruned
          # on the same schedule.
          find /backups \( -name "clawdia-*.gz" -o -name "clawdia-*.gz.enc" -o -name "clawdia-*.gz.unverified" -o -name "clawdia-*.gz.enc.unverified" -o -name "ultrabot-*.gz" -o -name "pre-migration-*.gz" \) -mtime +$$RETAIN -delete;
        };
        run_backup() {
          TIMESTAMP=$$(date -u +"%Y%m%dT%H%M%SZ");
          ARCHIVE=/backups/clawdia-$$TIMESTAMP.gz;
          # WORK is what mongodump and mongorestore see; ARCHIVE is what is
          # kept. With no passphrase they are the same path and every branch
          # below reduces to what this loop has always done. With one, ARCHIVE
          # gains the .enc suffix and WORK moves to the container own /tmp: the
          # plaintext of the database must not be written into the mounted
          # archive directory even for the seconds between the dump and the seal,
          # because that directory being readable is the whole premise.
          WORK=$$ARCHIVE;
          if [ -n "$$BACKUP_ENCRYPTION_PASSPHRASE" ]; then
            ARCHIVE=$$ARCHIVE.enc;
            WORK=/tmp/clawdia-$$TIMESTAMP.gz;
          fi;
          echo "[backup] Starting backup at $$TIMESTAMP";
          if ! mongodump --uri="$$MONGODB_URI" --gzip --archive="$$WORK"; then
            # mongodump has no rollback: a dump killed part-way through leaves
            # whatever it had written under the real name. Left there, that
            # partial file is what the boot catch-up counts as the backup for
            # that day and what `verify-backup.sh --latest` picks up — a failure
            # that reads as a success. Quarantined under the same suffix a
            # failed verification uses, so it is still pruned and still there to
            # look at.
            # Encrypting, the partial dump is plaintext in /tmp and is removed:
            # there is nothing there worth keeping that would be safe to keep.
            if [ "$$WORK" = "$$ARCHIVE" ]; then
              if [ -e "$$ARCHIVE" ]; then mv "$$ARCHIVE" "$$ARCHIVE.unverified"; fi;
            else
              rm -f "$$WORK";
            fi;
            echo "dump-failed $$TIMESTAMP" > "$$STATUS";
            notify "mongodump exited non-zero at $$TIMESTAMP; any partial archive was quarantined";
            return 1;
          fi;
          # Exit status 0 says mongodump ran, not that what it wrote can be read
          # back — a truncated archive from a full disk or a killed process is
          # the failure that stays invisible until the restore. --dryRun reads
          # and parses the whole archive and writes nothing, so every archive is
          # at least known to be parseable on the day it was taken. It is not a
          # restore rehearsal: for that, scripts/verify-backup.sh restores into a
          # scratch database and compares document counts, which needs
          # privileges this container deliberately does not have.
          # Sealed before it is verified, and verified by opening it again. The
          # archive that is kept is the encrypted one, and an archive that will
          # not decrypt is as lost as one that will not parse — so the thing
          # checked has to be the thing kept.
          #
          # `-pass env:` and not the passphrase on the command line: argv is
          # readable from the host with no access to this container at all.
          if [ "$$WORK" != "$$ARCHIVE" ]; then
            if ! openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BACKUP_ENCRYPTION_PASSPHRASE -in "$$WORK" -out "$$ARCHIVE"; then
              rm -f "$$WORK" "$$ARCHIVE";
              echo "encrypt-failed $$TIMESTAMP" > "$$STATUS";
              notify "archive $$TIMESTAMP could not be encrypted; nothing was kept for it";
              return 1;
            fi;
            rm -f "$$WORK";
            if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:BACKUP_ENCRYPTION_PASSPHRASE -in "$$ARCHIVE" -out "$$WORK"; then
              mv "$$ARCHIVE" "$$ARCHIVE.unverified";
              rm -f "$$WORK";
              echo "verify-failed $$TIMESTAMP $$ARCHIVE.unverified" > "$$STATUS";
              notify "archive $$TIMESTAMP did not decrypt back; kept as $$ARCHIVE.unverified and not counted as a backup";
              return 1;
            fi;
          fi;
          if ! mongorestore --uri="$$MONGODB_URI" --gzip --archive="$$WORK" --dryRun --quiet; then
            # Renamed rather than kept or deleted. Kept under its own name, an
            # unreadable archive is what --latest picks up and what the boot
            # catch-up counts as the backup for that day; deleted, an operator
            # has nothing to look at, and the check can fail for reasons that
            # are not the archive (mongorestore has to reach the server for
            # --dryRun too). The suffix keeps it off both globs and inside the
            # prune.
            mv "$$ARCHIVE" "$$ARCHIVE.unverified";
            rm -f "$$WORK";
            echo "verify-failed $$TIMESTAMP $$ARCHIVE.unverified" > "$$STATUS";
            notify "archive $$TIMESTAMP did not parse back; kept as $$ARCHIVE.unverified and not counted as a backup";
            return 1;
          fi;
          if [ "$$WORK" != "$$ARCHIVE" ]; then rm -f "$$WORK"; fi;
          echo "ok $$TIMESTAMP $$ARCHIVE" > "$$STATUS";
          touch "$$OK_MARKER";
          echo "[backup] Done: $$ARCHIVE";
        };
        # A container that was not running at 03:00 — a host reboot, an image
        # pull, a stack redeploy — used to skip the whole day and say nothing.
        # With the healthcheck now asserting a fresh archive, that gap would
        # read as a fault, so close it instead of reporting it: catch up on
        # boot whenever the newest archive is over a day old.
        if [ -z "$$(find /backups \( -name "clawdia-*.gz" -o -name "clawdia-*.gz.enc" \) -mmin -1440 2>/dev/null)" ]; then
          echo "[backup] No archive from the last 24h; backing up now instead of waiting for 03:00";
          run_backup || true;
          prune;
        fi;
        while true; do
          # Recomputed every iteration. A fixed `sleep 86400` after the dump
          # would start each run later than the last by however long the dump
          # and the prune took, walking 03:00 into working hours over a month.
          NOW=$$(date -u +%s);
          MIDNIGHT=$$(( ($$NOW / 86400) * 86400 ));
          TARGET=$$(( $$MIDNIGHT + 10800 ));
          if [ $$NOW -ge $$TARGET ]; then TARGET=$$(( $$TARGET + 86400 )); fi;
          SLEEP=$$(( $$TARGET - $$NOW ));
          echo "[backup] Sleeping $${SLEEP}s until next 03:00 UTC";
          sleep $$SLEEP;
          run_backup || true;
          prune;
        done'
    healthcheck:
      # Not "is the process alive" — it always is. The loop caught its own
      # failures with an `|| echo FAILED` into a log nobody reads, and the
      # container stayed Up, so `docker ps` and every dashboard showed green
      # while the backups rotted (#899). What is worth asserting is the
      # artifact, not the process: a run that finished AND parsed back inside
      # the last 26h. 26 rather than 24 leaves the dump itself room to run long
      # without flapping the container between healthy and unhealthy.
      test: ["CMD-SHELL", "find /backups/.backup-ok -mmin -1560 2>/dev/null | grep -q ."]
      interval: 1h
      timeout: 10s
      retries: 2
      # Only has to cover the boot catch-up above, which starts within seconds
      # of the container coming up. An hour is for the dump, not the wait.
      start_period: 1h

  # Optional container-level self-healing. Uncomment the whole block to enable.
  #
  # `restart: unless-stopped` restarts a container whose process *exited*. It
  # does nothing about a container that is up and failing its healthcheck —
  # outside Swarm, Docker records `unhealthy` and stops there — so an unhealthy
  # bot sits unhealthy indefinitely with nothing acting on it (#640). This
  # watches the daemon for that state and restarts containers labelled
  # `autoheal=true`.
  #
  # It ships commented out because of what it costs: the container holds the
  # Docker API, and anything that can reach the Docker API can read every
  # environment variable of every container on the host — the same exposure the
  # note at the top of this file describes, now granted to a container rather
  # than to whoever has a Portainer login. If you enable this, move the bot
  # token, the OAuth client secret, the session secret and the provider keys to
  # the <NAME>_FILE form first, so there is nothing in the environment to read.
  #
  # The alternative, with no socket involved, is the external uptime monitor in
  # README's Monitoring section: it sees the same state over HTTP and pages a
  # human instead of restarting on its own.
  # autoheal:
  #   image: willfarrell/autoheal:1.2.0@sha256:31f580ef0279eaced5b38d631b08c474d70d8403c1c2fdd6ddcf2e879d5f3f7c
  #   container_name: clawdia-autoheal
  #   restart: unless-stopped
  #   environment:
  #     # Only containers carrying the label, never every unhealthy container on
  #     # the host — this stack is not necessarily the only thing running here.
  #     - AUTOHEAL_CONTAINER_LABEL=autoheal
  #     # Long enough that a bot still inside `start_period` is never a candidate.
  #     - AUTOHEAL_START_PERIOD=120
  #     - AUTOHEAL_INTERVAL=30
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   # It talks to the daemon over the unix socket and to nothing else, so it
  #   # needs no network at all — including not the default bridge.
  #   network_mode: none

# Declare each secret once here, then list it under the service that needs it.
# `external: true` means Portainer > Secrets (Swarm) already holds the value;
# on a plain non-Swarm Docker host use the `file:` form instead, pointing at a
# root-owned, 0400 file on the host.
# secrets:
#   discord_token:
#     external: true
#     # file: /opt/clawdia/secrets/discord_token
#   client_secret:
#     external: true
#   session_secret:
#     external: true
#   mongodb_uri:
#     external: true
#   backup_encryption_passphrase:
#     external: true
#   secret_encryption_key:
#     external: true
#   openai_api_key:
#     external: true
#   gemini_api_key:
#     external: true
#   anthropic_api_key:
#     external: true
#   openrouter_api_key:
#     external: true

volumes:
  mongodb_data:
  # Written by the `backup` service and by the bot's pre-migration dump. A named
  # volume rather than a bind mount because a Portainer stack has no repo
  # checkout on the host to bind to.
  backups:

networks:
  clawdia-network:
    driver: bridge
  db-network:
    driver: bridge
    internal: true  # no external gateway — MongoDB cannot initiate outbound connections
